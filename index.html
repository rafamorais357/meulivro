rte. ₆Nos entregamos aos carniceiros e, por vezes, nós que o somos. ₇O arrependimento é como a água. ₈Limpe-se antes do dia acabar."}, {"n": 157, "text": "Existe uma multidão dentro de sua cabeça. ₂Existe uma multidão clamando por um senhor justo e forte. ₃Você é esse senhor! ₄Antes de idealizar um mundo perfeito, tome as rédeas do seu império interno e torne-o perfeito. ₅Você já parou para conversar com os seus súditos? ₆Qual foi a última vez que parou, por pelo menos trinta minutos, para conversar com a multidão que habita seu ser? ₇Seja o senhor!"}, {"n": 158, "text": "Iniciar uma reforma ao comprar um sítio é mais comum do que respirar sem pensar. ₂O sucesso não está na construção nem na reforma. ₃O que determina o sucesso é a manutenção. ₄Era feriado, dia de Zumbi dos Palmares; estava dentro de um carro, sentado no banco de trás do motorista, olhando através do vidro. ₅Ao longe, avistei um sinhô — ele estava lavrando sua terra, sob o sol das duas da tarde. ₆Quem aproveita enquanto os outros trabalham, escraviza a si mesmo. ₇Se o sol é para todos, a sombra nunca deverá ser só para um. ₈Se grandes homens e mulheres do passado tivessem optado pela sombra, o Dia da Consciência Negra não existiria. ₀Uma das camadas do amor é a empatia."}, {"n": 159, "text": "O escravo não é dono de si mesmo. ₂O escravo que almeja ser senhor, é um demônio que almeja ser anjo. ₃Encontre o equilíbrio entre ser senhor, servo e escravo. ₄Nunca se esqueça do banco no meio do lago. ₅Quem terá mais valor: quem, em questão de segundos, pensou no banco; quem o construiu em um dia; ou quem o manuteniu durante o passar dos anos? ₆Quem senta no banco e só pensa em si mesmo está se afogando em sua própria existência. ₇Quem senta no banco e só pensa nos outros, já está morto em vida."}, {"n": 160, "text": "Para mudar é necessário mudar. ₂Se você deseja mudar de casa, basta deixar sua casa atual e ir para uma casa nova. ₃O que está te impedindo de mudar? ₄Alguém, com toda certeza, dirá que falar é fácil e que, se fosse tão simples, todos fariam. ₅Pare de dar desculpas — é complexamente simples, e o difícil é simplesmente não fazer. ₆Entenda: mesmo que sua visão esteja aliada a um sólido propósito, para que ela salte do imaginário e ganhe vida, serão necessárias mudanças físicas, mentais e espirituais; muito controle emocional; mudanças relacionais, profissionais e financeiras. ₇Renúncia, disciplina e constância. ₈Se essas três palavras não lhe são familiares, você é apenas um monte de “bosta”, um peso morto, um jook."}, {"n": 161, "text": "Se você tem preguiça de se levantar para pegar o controle que está a um metro de distância, você já está morto! ₂A vida é justa; a nossa medida de justiça, que por muitas vezes é falha. ₃As palavras podem até chegar primeiro, mas o que realmente alimenta e produz vida são os frutos. ₄Hoje, Deus precisa do seu pouco para promover o muito. ₅Ele está pedindo para que você oferte com alegria os seus cinco pães e dois peixinhos. ₆O que você tem para oferecer? ₇A forma como você preenche o espaço vazio do seu tempo demonstra, com clareza, o que está sendo cultivado em sua alma. ₈Desligue a TV!"}, {"n": 162, "text": "A vaca rumina o alimento que comeu. ₂O que você tem ruminado? ₃A ruminação é importante, pois mostra o que está além do alimento. ₄A repetição dos atos afeta diretamente o repetidor. ₅Antes de se alimentar, diga em alta voz: “Eu, Rafael, estou me alimentando de tana-na” ₆Quem se alimenta sem pensar enche somente a barriga. ₇Quem pensa sobre o alimento rumina sobre si mesmo."}, {"n": 163, "text": "Se você compartilhar as mudas da flor principal, o seu crescimento jamais terá fim. ₂Quem não tem visão de futuro verá sua planta morrer; morrerá a planta principal juntamente com suas mudas. ₃O crescimento deve ser acompanhado de mudança. ₄A planta precisa de um vaso novo para acompanhar o seu crescimento, não só um vaso, mas também terra nova. ₅Quem compartilha investe no tesouro mais precioso. ₆Quanto mais mudas você compartilhar, maior será a sua riqueza, sua prosperidade e sua felicidade. ₇Poder compartilhar é o maior tesouro."}, {"n": 164, "text": "Finalize com o mesmo ímpeto do início. ₂O seu final sempre será mais lembrado. ₃Se você for extraordinário o tempo todo, você mesmo se colocará no status de normal. ₄O meio do caminho servirá como descanso. ₅Descanse em movimento. ₆A pausa é parte importante do desfrute. ₇Esteja sempre pronto para finalizar."}, {"n": 165, "text": "O buraco na alma, proporcionado pelos prazeres passageiros, tem um gosto amargo e o cheiro da podridão. ₂Você se torna escravo de tudo aquilo que lhe rouba o sopro da eternidade. ₃Gosto do que tem vida; inclusive, café traz vontade de viver. ₄Quem gosta do que tem vida, não limite sua existência ao mero ato de satisfazer os desejos do ego. ₅O que te traz vontade de viver? ₆O corpo satisfeito diz para a centelha divina: “Eu não preciso de você!” ₇O corpo é como uma roda d’água, que, com o seu movimento, produz energia. ₈Como agradecimento pelo seu movimento, as luzes se acendem."}, {"n": 166, "text": "A implementação e a prática de bons hábitos me abriram portas que, outrora, eu nem sabia que existiam. ₂Quanto mais me calo, mais me ouço e me contemplo. ₃Sorri para meu reflexo na água cristalina; por sua vez, Ele sorriu para mim. ₄Quando não cuido do reino, todos sofrem. ₅O rei sábio primeiro governa a si mesmo. ₆A paciência é uma virtude que deve ser examinada e questionada diariamente. ₇Quem está te observando pelo reflexo na água?"}, {"n": 167, "text": "A vitória de ontem não te faz um vitorioso por definição. ₂Não é porque você fez, aconteceu e foi aplaudido ontem que será hoje. ₃A vitória de ontem é a vitória de ontem. ₄A vida é uma sequência de encontros inéditos com o mundo. ₅A vitória e a alegria de ontem não garantem, por si só, a alegria de hoje, ainda mais em um mundo com constantes, rápidas e insólitas mudanças. ₆As alegrias e competências de ontem talvez não sejam suficientes para o hoje. ₇Cada vitória exigirá uma nova preparação; então, faça valer a pena no hoje, no aqui e agora, nesse momento."}, {"n": 168, "text": "Sábio não é aquele que antecipa o pensamento do próximo; sábio é aquele que antecipa os seus próprios pensamentos. ₂Você não precisa ser forte; você deve se sentir forte. ₃Quando se sentir forte, perceberá que a cada novo movimento a sua força aumentará. ₄A percepção de quem vai do claro para o escuro é diferente da de quem já está no escuro. ₅A recompensa é anterior ao prazer final. ₆Tudo começa e termina em sua mente. ₇Em que você está pensando nesse momento?"}, {"n": 169, "text": "Geralmente, os bloqueios ocorrem na infância ou adolescência e podem afetar sua vida adulta de maneira física, emocional, espiritual, relacional, profissional e financeira. ₂Identifique seus bloqueios e busque as causas e — as pessoas — que contribuíram, direta ou indiretamente, para o seu início e desenvolvimento. ₃Não tenha medo de mexer no lixo, pois, se não lidar com isso agora, provavelmente você terminará a vida fracassado, sentado em seu trono que está no topo de uma montanha de lixo. ₄Em algum momento teremos que liderar, governar e assumir de forma consciente o controle, seja de uma empresa, de um time ou de uma situação pontual. ₅Talvez você diga: “não nasci para ser um líder; não sei cuidar nem de mim.” ₆Se você não se governar, alguém fará isso por você. ₇Saiba que nunca é tarde para limpar o lixo e retomar o controle."}, {"n": 170, "text": "Até mesmo o incrível, se repetido muitas vezes, acaba se tornando um fardo, podendo se tornar algo chato e sem graça. ₂Não significa que deixará de ser incrível; porém, a repetição constante tem o poder de transformar o incrível em normal. ₃A saudade é o ingrediente secreto. ₄Ao se distanciar, você começará a perceber o que realmente é incrível, o que é bom e o que é normal. ₅Após alcançar essa clareza, coloque tudo em seu devido lugar. ₆Quando perceber que o incrível começou a se tornar normal, volte a ler este capítulo. ₇Não existe atração sem ação."}, {"n": 171, "text": "Deixe uma folha branca exposta ao tempo e ela logo ficará amarelada; cubra um carro com capa protetora e ele não tomará poeira. ₂A proteção após o uso é uma das camadas da manutenção. ₃Para proteger os objetos, podemos usar vidros, plásticos, tecidos, etc. ₄Como proteger o corpo, a mente e o espírito? ₅Não durma sem antes jogar o lixo fora e trocar o saco da lixeira. ₆Quem dorme ao lado do lixo se torna parte do mesmo. ₇Você já viu uma Ferrari dormindo na rua?"}, {"n": 172, "text": "Quando você não dá a devida manutenção ao seu corpo, mente e espírito, você não está somente se autodestruindo. ₂Sua falta de comprometimento está afetando seus familiares, seus amigos e, indiscutivelmente, todos à sua volta. ₃Quando você se eleva, o mundo todo se eleva. ₄A manutenção constante deve flertar com o vício. ₅Limpar, mesmo estando aparentemente limpo aos olhos, é uma virtude. ₆A manutenção da saúde física, mental, espiritual, relacional, profissional e financeira deveria ser obrigatória. ₇A mais bela demonstração de amor ao próximo está do outro lado do cuidado de si."}, {"n": 173, "text": "O momento que não foi verdadeiramente vivido não merece ser fotografado. ₂O que os olhos veem, o coração pode nunca ter sentido. ₃Uma imagem engana mais que mil palavras. ₄Existe muita beleza nas emoções verdadeiras. ₅Quem finge frente a uma câmera não terá problemas frente à vida. ₆Se você não se entregar e atuar verdadeiramente, receberá poucas fotos ao final da festa. ₇Fique tranquilo: os seus melhores momentos estão sendo registrados; apenas continue como se ninguém estivesse olhando."}, {"n": 174, "text": "Você está disposto a construir a ponte até o seu propósito? ₂Quem não constrói a ponte se contenta em observar, triste, do outro lado, a plenitude do seu eu que poderia ser. ₃Quando seu propósito se tornar sólido, a água se tornará clara e totalmente pura. ₄Agora que você tem água pura e limpa, como conseguirá o restante dos recursos? ₅O trabalho é a base de tudo nesta terra. ₆Quem não lavra a terra corre o risco de morrer ao lado de seu poço de águas claras e límpidas. ₇Você está multiplicando e compartilhando seus recursos?"}, {"n": 175, "text": "O sonho da criança que viveu na prisão é apenas se libertar e ir para um lugar em que ela possa ter paz. ₂Você cresceu e, antes que aprisione outra criança, não se esqueça de se libertar. ₃Pare de mentir: a criança ainda está presa. ₄Ouça os seus gritos angustiantes; ela está sendo sufocada por suas próprias lágrimas. ₅Ela se sente sozinha, confusa e culpada. ₆Eu amo a luz, mas, sempre que o monstro chega, é para o quarto escuro que eu corro e me tranco. ₇Eu odeio a escuridão, mas parece que só ela me entende e conforta. ₈Eu busco a anestesia, pois não quero confrontar a origem da dor. ₉Eu buscava confrontar a origem da dor. ₀Hoje, eu escolho voltar à prisão e me libertar."}, {"n": 176, "text": "Fiquei triste ao ver uma casa abandonada e um parque aquático sem água em plena tarde da véspera de um réveillon. ₂A função sem uso é como um barco parado no cais. ₃Você sabe o que é seguir um norte? ₄Descubra como usar sua bússola. ₅Entre no barco, faça dele a sua casa, fure um poço e desbrave a piscina do parque aquático. ₆O barco não foi pensado e estruturado para ficar parado em alto mar. ₇A âncora é um símbolo de tranquilidade, firmeza e esperança."}, {"n": 177, "text": "O que é propósito? ₂Você já encontrou o seu propósito? ₃O propósito é o trabalho? ₄Por que você acorda cedo todos os dias? ₅Desafios fazem a vida ter mais sentido? ₆Como é uma vida sem propósito? ₇Você escolhe o propósito ou ele te escolhe?"}, {"n": 178, "text": "Ir ao máximo da vibração e da intensidade é trazer vida para o seu corpo. ₂O corpo que não vibra é um esqueleto que se arrasta. ₃A vida abundante deve ser perseguida, buscada e alcançada. ₄Para se alcançar qualquer coisa, será necessário ambição, esforço, resiliência, disciplina e constância; ou seja, a base é o merecimento. ₅Você merece ter a vida dos seus sonhos? ₆Seja sincero: hoje, você é merecedor de viver e desfrutar do melhor desta terra? ₇O humano médio vive em torno de oitenta anos; por que você está reclamando das “dificuldades” do caminho e querendo tudo para ontem? ₈Aproveite a marcha e agradeça por cada km percorrido."}, {"n": 179, "text": "A guerra ama a paz. ₂Quando a paz me encontrar e desejar fazer morada, ficarei atento, pois saberei que eles me rodearão e tentarão me levar à guerra.. ₃Devo ser um intermediário, o círculo neutro no meio do caos. ₄Passei dez anos guerreando “sozinho” na floresta — preparei corpo, mente e espírito para, só então, voltar aos homens e evitar a primeira guerra. ₅Quando aprendi a amar, a dualidade se desfez, como vapor ao vento. ₆Não vejo nenhuma vantagem na guerra pela guerra, mas se algo ou alguém tocar minha paz, NÃO apertarei o botão. ₇Vigiarei acerca do que não posso ver, ouvir e tocar. ₈Povos do passado, vocês deveriam ter dito não."}, {"n": 180, "text": "Crescer exige dedicação, disciplina, constância e, principalmente, desapego. ₂Comece a pensar um pouco mais sobre o desapego de si mesmo. ₃O egoísmo é a base do crescimento e do transbordo — uso como exemplo uma árvore frutífera. ₄Mantenha-se distante enquanto o copo se enche. ₅O seu corpo, que lhe dá acesso ao mundo terreno, diante desse fato, trate de cuidar bem da sua casca. ₆Se você fizer tudo o que quer, terminará onde não quer. ₇O crescimento lento é como um sábio que ensina sobre a paciência. ₈O aprendiz que deseja acompanhar, vinte e quatro horas por dia, o crescer do mestre, se verá ansioso ao perceber que, visivelmente, não existe crescimento no presente."}, {"n": 181, "text": "O trauma se alimenta dos extremos. ₂A ação inconsciente gera energia de vida limitada; por sua vez, a ação consciente gera energia de vida ilimitada. ₃Os extremos se atraem: o bem atrai o mal, a guerra atrai a paz e o despertar, por sua vez, atrai a dormência, o ego e o declínio. ₄Antes de oferecer alimento a quem tem fome, santificarei o mesmo; também vigiarei pelo caminho, para santificar cada passo. ₅Apenas deixe de ser quem você não é — deixarei de ser quem não sou. ₆Como potencializar minha energia de vida e transformar a energia negativa em positiva? ₇Pratique a meditação da sombra; ou seja, converse com aquela que deseja sua morte — conversarei com aquela que deseja me matar. ₇Sendo você o protagonista da vida, tudo gira em torno da sua história — sua munição é infinita e sua morte será digna."}, {"n": 182, "text": "Para nadar em liberdade, é preciso interromper o abraço. ₂Liberte-se da dualidade e concentre-se apenas na luz divina que habita seu ser. ₃Antes de se deitar, deixe toda a sua casa limpa e organizada; logo após, descanse em paz. ₄Antes de se deitar, repita em alta voz: nada quebrado, nada faltando, tudo no lugar. ₅Pratique constantemente os rituais de bênção e gratidão. ₆Compartilhe seu conhecimento com aqueles que cruzarem o caminho. ₇A árvore que não compartilha seus frutos está morta."}, {"n": 183, "text": "A conversa consigo mesmo é a base do despertar. ₂A observação de si mesmo fará você escolher entre o um e o dois. ₃Mesmo depois de vencer o vício, continue treinando, pois ainda não é o fim; saiba que, logo, uma nova batalha será travada. ₄Esteja sempre pronto para dizer não, virar as costas e sair pela porta da frente. ₅Você não deve ser refém de si mesmo, e muito menos dos outros. ₆Por vezes, a resposta do universo será silenciosa, lenta e obscura. ₇Apenas continue na plateia."}, {"n": 184, "text": "Se você não exerce controle sobre os trinta minutos anteriores ao seu deitar, você ainda é um escravo. ₂As ervas do bem e do mal continuam a nascer, mesmo na plantação do mais justo. ₃Trate de fazer o trabalho durante à noite, de manhazinha e à tarde também. ₄Aquele que espera o jardim estar sujo para só então começar a limpeza, encontrará uma minhoca que comeu um caju. ₅O merecimento só pode ser alcançado mediante a ação consciente daquele que busca. ₆A energia se potencializa com o movimento uniforme e consciente — quem só vive parado, ou se movimenta de forma desuniforme e inconsciente, potencializa o mal. ₇Arranque a erva sem se apegar, pois a erva do bem e do mal continua a nascer, mesmo no coração do mais justo."}, {"n": 185, "text": "Busque a Deus. ₂Acredite em suas ideias e seja rápido. ₃Produza coisas palpáveis. ₄Mantenha sua essência. ₅Se reinvente sempre. ₆Busque a Deus de todo o seu coração. ₇Desafie a si mesmo. ₈Mesmo que te façam mal, nunca se iguale. ₉Saia, observe e faça perguntas. ₀Crie o novo!"}, {"n": 186, "text": "Sabe por que você não alcança os seus objetivos? ₂Porque você nem começou e já está pensando no final. ₃Você está pensando no milhão antes de ganhar cinco reais — está pensando nos dez quilômetros antes de conseguir correr cinco. ₃Entende que você desvaloriza as “pequenas” coisas e, por isso, acha que elas não merecem o seu tempo e esforço. ₄Acordar deve ser um evento e não uma mera tarefa. ₅Se não tratar o meu corpo, minha mente e meu espírito com respeito, ou seja, se eu não fizer o que tem que ser feito, jamais alcançarei o pleno sucesso — serei apenas uma alma vazia, abrigando uma casca qualquer. ₆O trabalho é passageiro, o corpo é passageiro, a vida é passageira — e o passageiro carece de atenção. ₇Tome o controle e pare de se sabotar — zere as desculpas, seja o chato que impulsiona a si mesmo e as outras pessoas."}, {"n": 187, "text": "Quando a incerteza tomar o seu coração, quando as portas parecerem fechadas, quando a ansiedade chegar — ore, converse com o Criador e tudo se endireitará. ₂Confie no Senhor! ₃Não espere por momentos difíceis, para só então se entregar totalmente. ₄Quem só procura o Pai nos momentos difíceis, jamais encontrará a verdadeira felicidade nos dias de “alegria”. ₅A alegria suprema está em servir ao Senhor com um coração jubiloso, não só com cânticos, cultos e ofertas, mas com todo o seu ser. ₆Desejo que encontres o caminho, e que Deus esteja contigo por onde quer que andares. ₇Confie no Senhor!"}, {"n": 188, "text": "O Universo está cagando para os seus atos conscientes; ele está atento ao seu inconsciente. ₂Carregue pedras e sementes nos bolsos. ₃Colha pedras pelo caminho e plante sementes em áreas abandonadas. ₄Quem é mais perigoso: um lobo ou uma cobra? ₅Você já matou uma cobra? ₆Examine o seu inconsciente de forma consciente. ₇Mate a cobra!"}, {"n": 189, "text": "Quando as pessoas estão nuas, elas se tornam mais iguais. ₂Ao intencionar e acionar para que o outro se molde aos meus padrões, me aprisiono e travo uma guerra perdida contra o EU. ₃Vigie ao passar por lugares que não contenham árvores frutíferas. ₄Se a solidão te perturba e você não aguenta mais ouvir a sua voz, te faço um convite —  vá ao deserto, feche seus olhos, abra seu coração e permaneça em silêncio por quatro dias. ₅Quando suas máscaras caem, o Universo se sente seguro para despir-se perante você. ₆Se o gigante não olhar para baixo enquanto anda, acabará matando algumas formiguinhas. ₇Não me importo com o seu tamanho, apenas siga o seu caminho — faça o seu trabalho com louvor e honra."}, {"n": 190, "text": "O caminho do meio está no alimento do amor e na transparência do julgamento. ₂A fé é provada até o último segundo, confie! ₃Felizes são aqueles que desenvolvem e praticam rituais. ₄Por que você está tentando quebrar a sétima parede? ₅Ok, quem vai junto chega junto, certo? ₆O que acha da ideia de que nem todos precisam sair ao mesmo tempo? ₇Divida grupos e deixe-os explorar. ₈As respostas estão no caminho e nos olhos de quem vê."}, {"n": 191, "text": "Onde existe festa, existe alegria. ₂Aprenda a amar a sua própria companhia, mas não se esqueça: a vida é muito mais alegre com pessoas por perto. ₃Por que ter uma casa gigante se você não faz festas? ₄Convide pessoas para um jantar, um almoço ou simplesmente para uma boa conversa. ₅Com muitas pessoas por perto a alegria sempre será renovada. ₆A alegria e o Amor não estão no tamanho da casa ou em sua localização. ₇Se você compartilhar o Amor, a festa jamais terá fim."}, {"n": 192, "text": "Cair da bicicleta, levantar, sacudir a poeira e continuar; ou cair e nunca mais voltar a pedalar? ₂Bem-aventurado é aquele que não se concentra no cair, mas sim no levantar. ₃Algumas vezes você irá cair sem ninguém por perto; nessa situação, será mais fácil prosseguir. ₄Em outras ocasiões, haverá uma multidão pronta para zombar, ridicularizar e não estender a mão. ₅Quando situações contrárias acontecerem — e, por Deus, elas acontecerão aos montes — como você irá lidar, superar, levantar, sacudir a poeira e continuar? ₆Sabe como separar um grupo de vencedores? ₇Analise como lida com problemas difíceis e, de forma consciente, entenda como os supera."}, {"n": 193, "text": "Quem espera pode se preocupar com a espera ou aproveitar esse tempo para se elevar. ₂Os tesouros mais valiosos não possuem uma placa dizendo o seu valor. ₃Os maiores tesouros pertencem a todos e a ninguém. ₄A moeda mais valiosa é a gratidão. ₅Como pagar a quem tem tudo? ₆Quem possui um grande tesouro acaba por perder a noção do seu valor com o passar do tempo. ₇Onde está o seu tesouro?"}, {"n": 194, "text": "Se você conhece o caminho, você corre. ₂Se você acha que conhece o caminho, você se distrai. ₃Não se deixe apressar pelos que estão atrás de você. ₄Respeitar aqueles que ainda não conhecem o caminho é uma virtude — e quem a coloca em ação, não precisa de buzinas. ₅Se o saber te faz correr, o que você precisa para só caminhar? ₆Quem sabe que nada sabe, será um eterno caminhante. ₇Errar para aprender custará seu tempo, seu presente, seu dinheiro, sua vida."}, {"n": 195, "text": "Se você não tem nem certeza de quem você é, como pode achar que conhece os outros? ₂Lutar sozinho tem o mesmo peso de lutar com uma equipe. ₃Você sempre será melhor que alguém e sempre existirá alguém melhor que você. ₄ O mundo está girando nesse exato momento, e você está girando junto com ele; não chore se você cair. ₅É o mundo que gira, você só tem que girar na mesma velocidade. ₆Todo monstro primeiro foi um humano — e todo humano carrega um monstro dentro de si. ₇Lute com’o um humano!"}, {"n": 196, "text": "O que move o mundo é o dinheiro — tive certeza desse fato caminhando pelas ruas de São Thomé. ₂O que movimenta esse sistema são os poucos bobos e os muitos inteligentes que se fazem de bobos. ₃Se tirarmos do homem o entretenimento, o sexo, a competição e o dinheiro — o que sobra? ₄A maioria olha ao longe no horizonte e, por pensarem muito, se estagnam por temerem o desconhecido; por sua vez, uma minoria está pronta para caminhar e se fazer conhecida. ₅As flores preferem uma porção de cuidados diários mais do que um cuidado excessivo a cada sete dias. ₆Se você tivesse dinheiro infinito — onde estaria agora? ₇Com quem estaria? ₈O que estaria fazendo? ₉Não dê dinheiro aos bobos, muito menos aos inteligentes que se fazem de bobos."}, {"n": 197, "text": "Você está lutando uma guerra que já foi perdida. ₂Aceite a sua derrota, torne-a pública e continue treinando todos os dias. ₃Você continuará treinando, não para se preparar para uma revanche, mas sim para aumentar a sua força e blindar suas fraquezas. ₄Continue treinando até o ponto de não precisar mais de uma vitória para se sentir vencedor. ₅O guerreiro mais forte é aquele que não luta. ₆Aquele que guerreou entendeu o sentido da paz. ₇Quem encontrou o amor encontrou o sentido da vida. ₈Se concentre no objetivo final, mas não somente nele, pois a magia está no caminho do meio. ₉O caminho do meio é o canalizador."}, {"n": 198, "text": "Você plasma e deixa plasmar o seu futuro — isso acontece quando alguém dita o seu próximo passo, escolhendo por você o seu próximo compromisso. ₂Quando alguém te conduz a revisitar lembranças do passado, ela está plasmando os seus pensamentos. ₃Existe magia natural e sobrenatural, da mesma forma que existe magia boa e má. ₄Eu estava sentado no chão, e uma folha estava alguns passos à minha frente; tentei trazê-la até minhas mãos apenas com a força do pensamento. ₅Tentei de verdade, lancei toda minha energia na esperança de que viesse até mim — o que aconteceu? Nada! ₆Estou aprendendo que posso usar a energia de um terceiro — que pode ser o vento, um gato, um humano ou até mesmo outro objeto. ₆Se concentre no que deseja, mas não somente no objeto desejado, pois a magia está no meio. ₇O meio é o canalizador."}, {"n": 199, "text": "Ou caminhando ou correndo, jamais caminhando rápido. ₂Você só poderá descansar quando tudo estiver limpo. ₃O atrasado corre em busca da paz que nunca encontra. ₄A paz é amiga de um coração limpo e puro. ₅Existe abundância na alma daquele que não quantifica o seu tempo com números. ₆No mundo dos homens, existe um sistema que te obriga a caminhar rápido. ₇Crie e viva no seu próprio ritmo."}, {"n": 200, "text": "Como viver em paz sem ter que guerrear? ₂Contemplação — contemple a ação. ₃Até no caos existe um padrão. ₄O padrão se forma no movimento. ₅Se você está desfrutando da paz, é porque alguém teve que guerrear. ₆A guerra dignifica o homem, pois faz com que ele movimente corpo, mente e espírito, em prol do maior bem da humanidade: a paz. ₇Quer viver em paz? ₈Alguém terá que guerrear."}, {"n": 201, "text": "Reclamar só amplifica o problema. ₂Acordar cedo sem propósito é uma tortura. ₃Acordar e se movimentar dignamente é um presente que aquece o corpo e o espírito. ₄Um corpo fraco limita um espírito forte. ₅Para vencer um sistema, crie o seu próprio sistema. ₆A guerra só existe quando os dois lados continuam guerreando. ₇Se você tem uma planta que te entrega quatro mudas ao ano, quantas mudas você terá em dez anos? ₈Aprenda a contar os seus dias com coerência e sabedoria."}, {"n": 202, "text": "Há uma batalha entre dois lobos dentro de nós; um é bom e o outro é mau. ₂Qual lobo vence? ₃O pecado, o lado negativo, os maus hábitos — se fazem mais vistos, pois o seu efeito é praticamente imediato. ₄O crescer da árvore é silencioso, mas a sua queda pode ser ouvida por toda a floresta. ₅Ao alimentar o lobo mau, ele recuperará as energias e te morderá. ₆A paz é silenciosa e não faz questão de ser vista. ₇Se você não sair para caçar, o lobo se alimentará de você. ₈Lobos não podem ser vegetarianos. ₉Do que você tem se alimentado?"}, {"n": 203, "text": "A vida é um jogo, e nesse jogo é o dinheiro que faz o movimento acontecer. ₂Viver no modo gratuito é orgânico, limitante e sustentável. ₃Trabalhe duro e certifique-se de não se vender por trinta moedas de prata. ₄O trabalho dignifica o homem, pois é no trabalho que o movimento acontece. ₅Como seria o seu jogo se você tivesse dinheiro infinito? ₆Se você quer um carro, trabalhe; se quer uma casa, trabalhe; se quer tempo, adivinhe... ₇Você já sabe o que deve ser feito."}, {"n": 204, "text": "A gaiola sempre esteve aberta. ₂Por que você ainda não saiu? ₃Ou melhor... por que insiste em sair e voltar? ₄Existe um tipo de escravo que fala sobre liberdade, igualdade e fraternidade, mas, se tivesse a chance, não hesitaria em ser senhor de escravos. ₅Desconfie de humanos que vagam pelas ruas durante o dia sem nada para fazer. ₆A felicidade está por toda parte, como o ar que, invisível, cobre toda a verde natureza. ₇Escreverei canções de amor sem precisar sofrer por elas; falarei sobre a paz sem precisar estar em guerra; amarei aqui e agora, no presente, meu refúgio, meu amor. ₈Existem escravos falando sobre liberdade. ₉A plateia é para todos, mas o palco é para poucos; não entregue o microfone a um tolo."}, {"n": 205, "text": "O ’eu’s não quer adoração, quer desmaterialização. ₂Foi me observando com consciência e transparência que aprendi que é possível ser bom, mas, ao mesmo tempo, ter atitudes espaçadas e repetidas de atos que não condizem em nada com o que é bom. ₃Te convido a ficar quatro dias só, em silêncio e sem movimento. ₄Limpe o lixo que está na sua cabeça. ₅O lixo é seu, e, sendo seu, não espere que alguém faça a limpeza que você já deveria ter feito; te garanto que você não será feliz até que se suje para se limpar. ₆Existem muitos humanos distribuindo bênçãos em nome de Deus — dizem: “Deus te abençoe, Deus te pague, Deus te acompanhe”. ₇Porém, vejo poucos dizendo com ações: “Eu te abençoo, Eu te pago, Eu te acompanho”. ₈Os humanos clamam por amor a cada nova tentativa de adoração."}, {"n": 206, "text": "Romantizar a vida é acreditar na mentira que você mesmo criou, ou escolheu acreditar. ₂A flor mais bela se destaca, a vaca que produz mais leite será melhor tratada e alimentada, e quem chega em primeiro recebe o troféu. ₃Somos os únicos seres que tentam lutar contra a natureza. ₄Nos martirizamos por nossos pensamentos, matamos precocemente o instinto natural latente em nosso ser. ₅Inventamos uma batalha interna, alimentamos de medo a lobos invisíveis, e nos culpamos por ser o que somos. ₆A flor murcha será arrancada e jogada fora, a vaca que não produz será levada ao matadouro, e quem chega em segundo só será lembrado como aquele que perdeu para o primeiro. ₇O que na verdade somos, o que eu vejo quando te vejo?"}, {"n": 207, "text": "Sua inquietação é fruto da falta de movimento consciente. ₂O movimento inconsciente é como um analgésico que alivia a dor, mas não cura a doença. ₃Você não deveria culpar o vento por entrar pela janela e bagunçar sua casa, que já estava bagunçada; afinal, você sempre soube que a janela estava aberta e, mesmo assim, não a fechou. ₄Toda família precisa de um líder, de um revolucionário, de um ator. ₅Depois que o homem experimenta a guerra, viver em paz se torna um tédio. ₆A guerra pune a falta de movimento; a paz, por sua vez, é quase um sinônimo de estagnação e descanso. ₇Existe um mistério no mundo dos homens — que se chama culpa."}, {"n": 208, "text": "O adversário se torna mais confiante quando você acusa o golpe. ₂A vida abundante só existe e só pode ser acessada na plena presença consciente do corpo, da mente e do espírito. ₃A comparação é a morte do crescimento. ₄Se um animal está invadindo sua casa e o seu primeiro pensamento é: “vou matá-lo”, cuidado. ₅Lembre-se de que você é o animal racional. ₆O seu primeiro pensamento deve ser: “vou trabalhar para fortalecer o meu abrigo”. ₇Se você não tapar o buraco dentro da sua propriedade, ninguém o fará por você, e, em uma bela tarde de domingo, uma vaca cairá dentro dele. ₈Só sente culpa quem sabe que poderia ter feito mais. ₉Você é o animal racional."}, {"n": 209, "text": "Quem lava um prato limpo, sem lhe ser ordenado, pode vir a receber mais honras que aqueles que lavam cem pratos sujos por mera obrigação, ou não. ₂Encontre mais satisfação e prazer no limpar do que no aproveitar, no desfrutar, no sujar. ₃A barraca é feita para dormir e se abrigar nos dias tempestuosos; no mais, a vida é lá fora. ₄Limpe a sua barraca diariamente. ₅Se for possível, desmonte a sua barraca todos os dias; volte a montá-la somente à noite e trate, também, de buscar conhecimento e sabedoria para saber quando e onde deixá-la montada. ₆Treine seu corpo para que o conforto seja encontrado mesmo estando deitado apenas sobre o chão, pois nunca se sabe quando o colchão irá furar. ₇Cada remendo conta uma história; a falta deles também."}, {"n": 210, "text": "Você pode sorrir, minha criança. ₂Porque a felicidade está lá fora e também está aqui dentro. ₃Você não precisa mais olhar para os lados para atravessar as ruas; os carros não mais existem, na verdade, nunca existiram. ₄Você está livre para ser o que quiser. ₅Feche os olhos, criança. ₆Você já pode descansar. ₇O paraíso te espera."}];
const mainChapters=chapters.filter(c=>c.n>=1&&c.n<=210);
let state=JSON.parse(localStorage.getItem('p1h210')||'null')||{read:[]};
const stages=[
 {at:0,icon:'🌱',name:'Semente'},
 {at:15,icon:'🌱',name:'Raízes'},
 {at:35,icon:'🌿',name:'Primeiros brotos'},
 {at:70,icon:'🪴',name:'Planta jovem'},
 {at:105,icon:'🌿',name:'Novos ramos'},
 {at:140,icon:'🌳',name:'Árvore em crescimento'},
 {at:175,icon:'🌳',name:'Copa fortalecida'},
 {at:210,icon:'🌸',name:'Florescimento'}
];
function save(){localStorage.setItem('p1h210',JSON.stringify(state));render()}
function stageFor(n){let s=stages[0];for(const x of stages)if(n>=x.at)s=x;return s}
function readCount(){return state.read.filter(n=>n>=0&&n<=210).length}
function render(){
 const n=readCount(),p=Math.round(n/211*100),s=stageFor(n);
 document.getElementById('label').textContent=`${n} de 211 capítulos`;
 document.getElementById('pct').textContent=p+'%';document.getElementById('bar').style.width=p+'%';
 document.getElementById('tree').textContent=s.icon;document.getElementById('stage').textContent=`${s.name} • ${210-n} capítulos para completar a jornada`;
 const next=nextUnread();
 document.getElementById('mainChapterList').innerHTML=chapters.filter(c=>c.n>=0&&c.n<=210).map(c=>{
   const done=state.read.includes(c.n);
   const locked=c.n>next;
   return `<button id="chapter-${c.n}" class="chapter ${done?'done':''} ${locked?'locked':''}" ${locked?'disabled':''} onclick="openChapter(${c.n},false)"><strong>Cap. ${String(c.n).padStart(2,'0')}</strong><span>${done?'✓ lido':locked?'🔒':'›'}</span></button>`;
 }).join('');
}
function nextUnread(){for(let n=0;n<=210;n++)if(!state.read.includes(n))return n;return 210}
function continueReading(){
 const n=nextUnread();
 const el=document.getElementById(`chapter-${n}`);
 if(el){
   el.scrollIntoView({behavior:'smooth',block:'center'});
   el.classList.add('current');
   setTimeout(()=>openChapter(n,false),650);
 }else{
   openChapter(n,false);
 }
}
function getCap(n){return chapters.find(c=>c.n===n)}
function openChapter(n,free=true){experienceMode=false;experienceHome=false;
 const c=getCap(n); if(!c)return;
 document.getElementById('modal').classList.add('open');
  document.getElementById('wrap').innerHTML=`<article class="reader">
 <div class="reader-top"><button class="back" onclick="${free?'openLibrary()':'closeModal()'}">‹ ${free?'Voltar ao início':'Fechar'}</button><span class="capmeta">CAP ${String(n).padStart(2,'0')}</span></div>
 <h2>${n===0?'Abertura':'Capítulo '+String(n).padStart(2,'0')}</h2>
 <div class="reader-text"><p>${escapeHTML(c.text)}</p></div>
 ${free?navFree(n):`<button class="wide" onclick="finish(${n})">${state.read.includes(n)?'Capítulo concluído ✓':'Concluir capítulo'}</button>`}

let soundEnabled = localStorage.getItem('p1hSound') !== 'off';
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(Ctx) audioCtx = new Ctx();
  }
  return audioCtx;
}
function tone(freq=440,duration=.12,volume=.035,type='sine',delay=0){
  if(!soundEnabled) return;
  const ctx=getAudioCtx(); if(!ctx) return;
  const start=ctx.currentTime+delay;
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type=type;
  osc.frequency.setValueAtTime(freq,start);
  gain.gain.setValueAtTime(0,start);
  gain.gain.linearRampToValueAtTime(volume,start+.01);
  gain.gain.exponentialRampToValueAtTime(.001,start+duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start(start); osc.stop(start+duration+.03);
}

  tone(520,.10,.03,'sine',0);
  tone(660,.12,.028,'sine',.08);
}
function playUnlock(){
  tone(420,.08,.022,'triangle',0);

}
function playGrowth(){
  tone(392,.10,.025,'sine',0);

  tone(659,.16,.025,'sine',.16);
}

  if(typeof soundEnabled!=='undefined' && !soundEnabled) return;
  try{
    const ctx = typeof getAudioCtx==='function' ? getAudioCtx() : null;
    if(!ctx) return;
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    const now=ctx.currentTime;
    osc.type='sine';
    osc.frequency.setValueAtTime(620,now);
    osc.frequency.exponentialRampToValueAtTime(760,now+.055);
    gain.gain.setValueAtTime(0,now);
    gain.gain.linearRampToValueAtTime(.018,now+.008);
    gain.gain.exponentialRampToValueAtTime(.001,now+.075);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now+.085);
  }catch(e){}
}
