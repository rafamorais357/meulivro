<script>
const chapters=[{"n": 0, "text": "Sonhos nascem e morrem com a mesma velocidade com que você abre e fecha os olhos. ₂É mais fácil e cômodo ficar com os olhos fechados. ₃Um propósito sem manutenção enferruja, apodrece e morre. ₄Os sonhos anestesiam a alma, mas, sem ação, a dor da realidade sempre volta. ₅Se você não se preparar para a tempestade, não terá o direito de reclamar quando estiver se molhando. ₆O maior prêmio para quem se prepara é a paz de espírito. ₇Para quem vive de olhos fechados, tudo sempre será uma grande ilusão."}, {"n": 1, "text": "Imagino e anseio por um mundo de harmonia entre os seres. ₂Um mundo sem o desejo pela vitória e sem o prazer pela competição. ₃Um mundo onde os seres humanos aguardassem os meses de fevereiro e março para comerem goiaba e, nesses meses, pudéssemos trocar doces, não vendê-los. ₄Anseio por um mundo repleto de árvores frutíferas e com menos bancadas de feiras. ₅Sonho com um mundo onde os animais sejam honrados, não usados como alimento por nós, humanos. ₆Anseio por humanos que não roubem, mas peçam — anseio por humanos que compartilhem sem medidas e sem interesses. ₇Que a palavra guerra perca o seu significado; que a palavra união esteja gravada na alma; que a palavra amor realmente signifique tudo; e que Deus seja o centro de tudo."}, {"n": 2, "text": "Lembre-se dos primeiros ensinamentos. ₂Fotografar o geral e o particular é um princípio básico para se obter uma boa história. ₃Menos é mais! ₄Colocando em prática esses ensinamentos, sua jornada será mais tranquila e prazerosa. ₅Não tenha inveja do seu próximo, pois, assim o fazendo, nunca encontrarás um motivo para acordardes feliz pela manhã. ₆Seja o melhor em fazer o mais simples e verás que, aos poucos, serás o melhor que podes ser. ₇Menos é mais! ₈Repito para que não tenhas a audácia de esquecer."}, {"n": 3, "text": "Os incríveis criam, os bons aplaudem e copiam, os normais só aplaudem. ₂Não consegue ver a diferença entre a criatura e o criador? ₃Você é incrível, bom ou normal? ₄Responda sem medo, pois não irei lhe jugar. ₅O julgamento mais duro sempre virá de você. ₆Julgue-se agora e prepare-se para os tempos do fim. ₇O ego faz o incrível se tornar medíocre."}, {"n": 4, "text": "Entre a necessidade e o desejo existe um muro de Berlim, levantado por mim. ₂É irônico dizer que certas coisas de que necessito, não desejo. ₃Mais irônico ainda é dizer que existem dezenas, centenas, milhares de coisas que desejo e não necessito. ₄Quando será que aprendi a gostar ou não de alguma coisa? ₅Quem será o humano que me ensinou o que eu jamais desejaria ter aprendido? ₆Pois bem, perguntas movem o mundo, certo? ₇O jogo de interesses entre necessidade e desejo faz você correr."}, {"n": 5, "text": "Muitos anseiam pela morte e não encontram motivos fortes para continuar no planeta Terra. ₂Muitos desses não possuem a coragem necessária para apertar o botão de desligar. ₃Vagam miseravelmente e sem sentido pelas ruas. ₄Buscam sentido, presos como um pássaro dentro de sua gaiola. ₅O pássaro não escolhe estar preso ou não, mas escolhe se render e aceitar sua falta de liberdade. ₆Morra em uma gaiola sem se render ou apenas aceite ser brinquedo de humanos. ₇Humanos aprisionam pássaros."}, {"n": 6, "text": "Não espere que uma redação de trinta linhas esteja pronta em sua cabeça para, só então, começar a escrevê-la. ₂Escreva o primeiro parágrafo. ₃Não espere ter uma biblioteca para começar a ler livros. ₄Leia livros e, um dia, você terá uma biblioteca. ₅Dez livros lidos, jogados no sofá, valem mais do que uma bela biblioteca por ler. ₆Antes de comprar uma Ferrari, domine e aproveite ao máximo o seu Fusquinha. ₇Ferraris zeradas podem não valer um Fusca usado."}, {"n": 7, "text": "Nosso desejo incansável por catalogar tudo e todos é o que inevitavelmente limita nossa evolução. ₂Permita-se compreender que o aqui e agora é passado, presente e futuro. ₃Não perca tempo tentando separar três que são um. ₄Pecamos, pois olhamos muito para o caminho já percorrido. ₅Pecamos, pois tentamos descobrir todo o caminho à frente. ₆Todos pecamos! ₇Siga o caminho, a verdade e a vida — assim o fazendo, você chegará onde nunca deveria ter saído. ₈O ponto final é o mesmo que o inicial."}, {"n": 8, "text": "Descendo uma escada correndo e com os olhos vendados, você provavelmente cairá. ₂Qual é o preço a se pagar pela velocidade e por achar que já conhece todo o caminho? ₃Olhando rapidamente, todos os degraus parecem iguais. ₄Olhando sem pressa, nada nunca é igual. ₅Com treino e repetição, é possível descer uma escada vendado e correndo. ₆Não viva a vida da mesma forma que você desce escadas. ₇Aprenda a descer escadas!"}, {"n": 9, "text": "Um humano de quarenta anos pode nos contar como é ter essa idade. ₂Certas coisas só saberemos ao certo quando chegar a nossa vez. ₃Viver é particular e, ao mesmo tempo, muito coletivo. ₄Minha liberdade bate de frente com a sua. ₅Quem está em paz está próximo da guerra. ₆Aqueles que guerreiam terminam mortos ou em paz. ₇A sua liberdade bate de frente com a minha."}, {"n": 10, "text": "Desejo é momento e alimento. ₂Não adianta forçar um orgasmo, nem’uma inspiração. ₃Aqueles que vendiam o seu ponto de vista entenderam que, mostrar àqueles que haviam comprado, trazia mais resultado. ₄Me permito ver o Japão, mesmo morando em Pequim. ₅Não sou turista! ₆Não tente me vender o seu ponto de vista. ₇Inspiração e orgasmo, quando não buscados, acabam chegando naturalmente."}, {"n": 11, "text": "Por vezes, abrimos caminhos que deveriam continuar como mata fechada. ₂Entramos, desmatamos e passamos. ₃Invadimos, destruímos e fugimos. ₄Preferimos o asfalto, pois o mesmo “não tem” buracos. ₅Você já construiu um asfalto? ₆Com meus pés descalços, construo um trilho pequeno. ₇Com dez pés descalços, construímos uma estrada “perfeita” e com buracos."}, {"n": 12, "text": "Hoje, pude contemplar um maravilhoso pôr do sol. ₂Ouvi dizer que dinheiro compra tudo. ₃Disse ao dono de tudo que desejaria ver o pôr do sol às vinte e duas horas. ₄Afirmei: dinheiro não é problema! ₅Pelo jeito, Ele não aceitou, pois, às vinte e duas horas, choveu. ₆Fiz uma nova oferta: aceito ver o pôr do sol no horário proposto pelo Senhor; porém, quero vê-lo no dia cinco de maio de dois mil e cinco. ₇Dinheiro não compra tudo!"}, {"n": 13, "text": "Entendemos como é bom poder andar quando vemos um idoso com muletas se movimentando em passos nada largos. ₂Entendemos o valor da visão quando ela não oferece mais a mesma nitidez de outrora. ₃Entendemos o valor da audição quando as pessoas, estando ao nosso lado, começam a ter que gritar. ₄Paladar e olfato, de igual modo, precisam da falta para alcançarem total validação. ₅Dar bom dia serve para uma, duas, três, quatro, cinco, seis e, quem sabe, até para sete pessoas, mas não se aplica para uma multidão. ₆As manhãs nas pequenas cidades costumam ser de bom dia. ₇Aprenda o valor de um bom dia!"}, {"n": 14, "text": "O instinto animalesco pelo sexo, no início da puberdade, vem mostrar que somos animais pensantes em evolução. ₂A pessoa mais doce, ao receber um soco, reage, se transformando em uma besta fera em questão de segundos. ₃Vencer os tipos variados de instintos animalescos nos aproxima de Deus. ₄Os animais também amam de forma incondicional os da sua família, ou seja, o próximo. ₅Amando somente o próximo, não estaremos sendo melhores que os animais. ₆Devemos amar o próximo que não está próximo. ₇Os animais têm vantagens sobre os homens? ₈Não vendem, não roubam e não usam maquiagem? ₉Eles honram seu Criador, sendo o que nasceram para ser?"}, {"n": 15, "text": "Não escreva o capítulo zero pensando no capítulo setenta. ₁Escrever por dinheiro acabará lhe tirando partes do presente. ₂Escrever por amor alimentará sua alma e lhe fará presente. ₃Uma encadernação de luxo ou uma encadernação feita em uma papelaria? Só para ajudar em sua resposta, o conteúdo continuará sendo o mesmo. ₄Por vezes, apenas uma folha rasgada pode fazer uma falta incalculável. ₅Você aceitaria um livro sem capa? ₆O pintor pinta, o escritor escreve, o fotógrafo fotografa, o vendedor vende e o leitor entende. ₇O artista cria por necessidade — a partir do momento em que passa a ser através do seu esforço, ele é sufocado e esmagado."}, {"n": 16, "text": "O fruto, por si só, não pode gerar uma árvore; porém, uma árvore sadia pode gerar um fruto sadio. ₂As suas boas obras não produzirão fé genuína, mas a sua fé genuína poderá vir a produzir boas obras. ₃A fé é a árvore e também o adubo. ₄A semente é a dádiva do fruto. ₅Um solo sadio é a dádiva da semente. ₆Qualquer árvore, nesta terra, está sujeita aos ataques de pragas. ₇Como você tem cuidado da sua árvore?"}, {"n": 17, "text": "Não me apegarei ao passado, pois já passou. ₂Não terei longos devaneios com o futuro, pois pode não chegar. ₃Apenas receberei o meu presente com a certeza de aproveitá-lo. ₄Quando uso o meu presente para voltar ao passado, estou usufruindo do meu futuropresentepassado. ₅Acabei de sonhar com os escritos acima. ₆Não estou escrevendo por dinheiro; tornei-os reais, pois era um sonho inspirador. ₇Quando meu sonho se transformar em dinheiro, irei usá-lo para o meu prazer. ₈Compartilhar o Amor será o meu prazer! ₉O que você tem sonhado? ₀Seus sonhos podem dizer muito sobre você."}, {"n": 18, "text": "Você tem trezentos e sessenta e cinco dias por ano, trinta dias por mês, sete dias por semana e vinte e quatro horas por dia, certo? ₂Não, eu só tenho a certeza do agora! ₃Comece a viver o presente com sabedoria e intensidade. ₄Não queira abraçar o mundo. ₅Lembre-se de que somente uma pessoa por vez pode ter o seu abraço total. ₆Você já recebeu um abraço de um minuto? ₇Quanto vale um minuto do seu tempo presente?"}, {"n": 19, "text": "Conversando com um senhor de setenta anos, ele me disse, bem empolgado, o quanto estava aproveitando a internet — lá tem tudo! ₂Não tenho tempo para ler um livro completo; por isso, aproveito pequenas reportagens, vídeos curtos e outros conteúdos de rápido acesso. ₃Confesso que fiquei bem aflito, pois, se ele não tem tempo, qual esperança eu posso ter? ₄As crianças têm todo o tempo do mundo e quase sempre o utilizam bem; porém, não se lembram de muita coisa quando crescem. ₅Os adolescentes têm muito tempo e nenhum interesse em aproveitá-lo. #preguiça ₆Os jovens queriam mais tempo, só que entre trabalho, faculdade e semana de provas, não sobra quase nada. ₇Os adultos estão preocupados com família, filhos, contas, responsabilidades, etc. ₈Os idosos têm todo o tempo do mundo, mas, na maioria dos casos, pouco vigor para aproveitá-lo."}, {"n": 20, "text": "Achamos a lua cheia linda e, por muitas vezes, desprezamos suas outras fases. ₂Muitas vezes, fazemos o mesmo com os seres humanos. ₃Damos valor quando fazem o que queremos, quando se doam sem questionar ou ainda quando estão maquiadas e “bonitas”. ₄As fases da lua vão de um brilho intenso até a total escuridão. ₅Não se esqueça de que a lua continua sendo lua, independentemente da sua fase. ₆Você ama a lua ou só a lua cheia? ₇Aprenda a ver beleza em todas as suas fases."}, {"n": 21, "text": "Qual é o melhor presente que se pode dar a um ser humano? ₂Responda à pergunta e só depois passe para o próximo capítulo."}, {"n": 22, "text": "Experimente se ouvir enquanto estiver falando. ₂Você é o seu melhor ouvinte? ₃Eu sou o meu melhor ouvinte. ₄Se escute mais e poderás fazer uma boa análise de sua vida. ₅Por que você procura tanto conteúdo escolhido por curadores? ₆Você não é capaz de escrever a sua própria história? ₇Fale e ouça ao mesmo tempo. ₈Você usaria o seu presente para se ouvir falando?"}, {"n": 23, "text": "Será necessário ensinar o que é saúde antes de ensinar o que é a doença. ₂É necessário ensinar o amor antes do ódio. ₃O ato de doar antes de receber. ₄O SER antes do TER ₅Mesmo ensinando a paz, alguns escolherão a guerra. ₆Mesmo em meio à guerra, continue ensinando a paz. ₇Antes de ensinar, trate de aprender — após aprender, questione tudo e todos."}, {"n": 24, "text": "O autor revela traços de si mesmo em sua criação. ₂Quem se depara com a criação, através de si, faz a leitura dos traços do autor. ₃Não será possível entender a totalidade da criação, somente utilizando partes da mesma. ₄Não é possível conhecer o autor apenas conhecendo a totalidade da sua criação. ₅Os traços revelados revelam e, ao mesmo tempo, ocultam. ₆Se quiser entender o autor, não o tente através da sua criação. ₇Seja autor!"}, {"n": 25, "text": "Humanos gastam milhões procurando vida em outros planetas; enquanto isso, centenas de milhões morrem de fome aqui. ₂A fome poderia acabar agora se os humanos deixassem de pensar no particular e começassem a pensar no coletivo. ₃Caminhe pela manhã em meio à natureza, e você ouvirá o mundo falando com você. ₄Os humanos tentam silenciar o mundo. ₅Em “nossas” selvas de pedras — nós nascemos e morremos, compramos e vendemos, nos alegramos e sofremos. ₆Nossa válvula de escape é a natureza. ₇Estamos destruindo nosso mundo e, ao mesmo tempo, buscamos outros que possam’os destruir no futuro."}, {"n": 26, "text": "O resultado final é fruto dos fatores. ₂Se eu ditar cem números pausadamente, você conseguirá somá-los e facilmente chegará ao resultado, certo? ₃E se, logo depois, eu lhe perguntar quais foram os números e qual a ordem dos mesmos, você saberá me responder? ₄Certamente se lembrará de alguns; porém, inevitavelmente, acabará se perdendo na ordem. ₅Não devemos tentar guardar o caminho. ₆Só guarda o caminho quem pensa em voltar. ₇Para que o resultado final seja correto, é necessário apreciar, contemplar e vivenciar o caminho, mesmo se tudo estiver dando errado."}, {"n": 27, "text": "A contemplação só é possível quando nos damos conta do milagre da criação. ₂É difícil contemplar o pôr do sol com os olhos de quem só viu a escuridão. ₃É difícil beber água com o mesmo prazer de quem tem sede há dias. ₄É difícil contemplar o céu infinito e estrelado, tendo uma tela “finita” à minha frente. ₅Sentir saudade é uma boa forma de voltar a olhar com verdade. ₆Sentir saudade dói, mas também pode curar. ₇É maravilhoso fazer parte da criação e é um presente poder contemplá-la a cada novo amanhecer."}, {"n": 28, "text": "Uma pequena tormenta inunda um vilarejo, fazendo com que todos se mudem. ₂Movimento gera movimento. ₃Quando me coloco em movimento, o mundo se movimenta. ₄Meu movimento afeta o mundo e os seres que nele habitam. ₅Pessoas movem pessoas. ₆Passar o dia deitado na cama também é uma forma de movimento. ₇Há tempo para tudo. ₈Por vezes, é necessário movimentar o silêncio e ouvir o seu interior."}, {"n": 29, "text": "No passado, as tatuagens não podiam ser apagadas; hoje pode-se passar uma borracha. ₂A borracha apaga o medo do erro. ₃Se você só tivesse uma folha de papel, escolheria ter um lápis e uma borracha ou uma caneta? ₄Se você tiver folhas infinitas, não se contente com apenas uma caneta. ₅No passado, as borrachas não podiam apagar a tinta de uma caneta; hoje, algumas podem. ₆Quem aceita e entende que eventualmente irá errar recebe papéis infinitos, e uma caneta de cada vez. ₇As borrachas apagam os erros, mas não podem apagá-los."}, {"n": 30, "text": "Histórias iguais são lembradas quando contadas de formas diferentes. ₂Grandes retas e fortes curvas se destacam na viagem. ₃Muitos acidentes acontecem nas curvas. ₄É preciso entender que uma estrada não é feita só de retas. ₅Depois de uma reta, virá uma curva. ₆Quando estiver feliz, aproveite, pois seu próximo estado será triste. ₇Aproveitar o dia é como dirigir por uma grande reta sem pensar que, em breve, ela se transformará em uma curva."}, {"n": 31, "text": "Gosto muito do sol; porém, tenho que confessar que, depois de quinze dias de puro calor, estou desejando o frio. ₂Amo os dias de chuva, mas, depois de uma semana fria e chuvosa, estou desejando dias ensolarados. ₃Os dias de chuva me fazem pensar nos dias de sol. ₄Quando a falta se faz presença, a contagem regressiva começa. ₅Não existe fotografia completamente preta ou completamente branca. ₆Uma fotografia bem revelada combina o preto e o branco em tons de cinza. ₇A harmonia, tanto na vida como na fotografia, depende do equilíbrio. ₈Necessito da chuva, tal como necessito do sol; necessito do preto, tal como necessito do branco."}, {"n": 32, "text": "Se uma agulha no palheiro fosse importante, você faria de tudo para encontrá-la. ₂O que não é importante se torna igual. ₃0, 1, 2, 3, 4, 5, 6, 7... ₄Todos são números, todos são diferentes e, ao mesmo tempo, todos são importantes. ₅Quando você começar a se achar melhor que os outros, olhe para os números. ₆1+1=?, 2+1=?, 2+1+3=?, 0+6=? ₇Não pense que aqueles que nasceram sem dedos não possuem digitais."}, {"n": 33, "text": "Até ontem, eu não sabia preparar um queijo, e agora desejo ser um queijeiro. ₂Há algumas horas eu não sabia fazer um bolo igual ao da minha tia, perguntei como fazer e ela prontamente me ensinou; eu só comia aquele tipo de bolo quando era ela quem fazia, agora posso prepará-lo sempre que quiser. ₆No passado, era necessário ver um filme ou ouvir uma música com muita atenção, como se fosse a última vez, pois não era possível saber quando eles estariam presentes novamente. ₇No passado, a saudade era impogsta; hoje, ela pode ser escolhida."}, {"n": 34, "text": "Quem vive no meio de uma floresta jamais correrá o risco de morrer dirigindo um carro, mas poderá morrer por uma picada de serpente. ₂Você cria os seus problemas! ₃Dirigindo em uma reta, você poderá alcançar altíssimas velocidades. ₄Dentro de um avião, você ganhará asas. ₅Pelo desejo de proteção criamos armas. ₆Desejamos e criamos, matamos e morremos. ₇Chegamos mais rápido ao destino final."}, {"n": 35, "text": "Perguntaram-me qual era a minha cor preferida. Eu respondi que gostava de todas. Insistiram: “Escolhe uma; deve haver uma que te agrade mais.” ₂Percebi que, além de me darem um nome, eu teria que seguir as suas regras. ₃Posso ser quem eu quiser, mas, primeiro, tenho que ser o que eles querem que eu seja. ₄Não consigo entender por que, dentre tantas regras, não exista uma que diga que o mundo pertence a todos os seres humanos. ₅Como podem suportar o fato de terem pedaços do mundo, enquanto outros não têm nem o próprio túmulo? ₆Nossa desUNIÃO é a causa de tudo. ₇Nos dividimos em continentes, países, estados, cidades — nos dividimos e sofremos."}, {"n": 36, "text": "Estou em silêncio e, à minha volta, pássaros estão a cantar. ₂Encontrei mais sabedoria no voo silencioso de um pássaro do que na fala de muitos humanos. ₃Confiar na sua própria sabedoria é o mesmo que se deixar guiar por um cego no escuro. ₄Busquei e encontrei sabedoria no silêncio — no silêncio total, no silêncio do próximo e, principalmente, no meu próprio silêncio. ₅Eu já sei falar e, agora, estou aprendendo a me calar. ₆O silêncio não é só da boca. ₇Muitas vezes é preciso “calar a boca” e movimentar o corpo. ₈Suba no topo de uma montanha e grite."}, {"n": 37, "text": "Peça para quatro fotógrafos diferentes capturarem uma fotografia do mesmo assunto e, depois, observe os resultados. ₂O assunto continuará o mesmo, porém com visões diferentes. ₃Cada fotógrafo fará um registro único, com perspectiva e técnicas próprias. ₄O tratamento das imagens e a edição trarão à tona o estilo de cada fotógrafo. ₅Iguais e, ao mesmo tempo, diferentes. ₆É quente, mas não quente o bastante para queimar. ₇É frio, mas não frio o bastante para congelar."}, {"n": 38, "text": "Eu me perdi na caminhada, estou parado no nada, e não sei pra onde vou. ₂Vejo pessoas indo e vindo, estão vagando por aí, buscando um sentido e uma razão pra existir. ₃Eu pareço invisível em um mundo sem amor, um estranho, diferente, um santo. ₄Parado no caminho, parado no tempo. ₅Um estranho, diferente, um santo. ₆A música acaba e eu volto a pensar, em humanos que não param e não querem se salvar. ₇Um estranho, um diferente, um santo."}, {"n": 39, "text": "É possível conviver consigo mesmo por uma vida toda e, mesmo assim, nunca saber quem realmente você é. ₂Quem você é? ₃Quem você era? ₄Quem você se tornou? ₅O que você faz no escuro fala mais sobre você do que todos os seus atos feitos sob o sol do meio-dia. ₆O poder me fez não poder. ₇Para alguns, o seu “nada” é tudo. ₈Existem aqueles que usam todas as letras do alfabeto e, mesmo assim, acabam não dizendo nada. ₉Existem aqueles que fazem uso do silêncio e dizem tudo."}, {"n": 40, "text": "A repetição forja o assassino. ₂A impunidade traz um falso sentimento de legalidade. ₃Quem será pior — aquele que mata ou aquele que manda matar? ₄Quem mata um animal consegue matar um ser humano. ₅Quem come um animal se torna parte dele. ₆Matamos porque amamos o próximo que está próximo. ₇Alguém, um dia, ensinou que devemos amar o próximo."}, {"n": 41, "text": "Onde você está? ₂Sei onde procurá-la durante a noite e sei como encontrá-la durante o dia. ₃Por que, então, me mantenho distante? ₄A saudade aduba e fortifica os relacionamentos. ₅Quando a minha amada está presente, eu não paro; quando ela se vai, me coloco em silêncio. ₆Tenho a melhor das amantes, pois, mesmo podendo ser de todos, ela é só minha. ₇Minha inspiração."}, {"n": 42, "text": "Falta é quando o que era familiar não está presente. ₂Saudade é quando a vida continua. ₃Sinto falta de correr à noite. ₄Sinto saudade de correr à noite com o meu melhor amigo. ₅A falta de saudade me faz pensar se realmente está tudo bem. ₆A saudade faz falta quando eu penso em correr. ₇O certo é que a vida sempre continua."}, {"n": 43, "text": "Quem, com alegria, deixa de ter para que os outros tenham, alcança bem-aventuranças. ₂Um bilionário que dá um milhão aos pobres pode não saber o que é ser bem-aventurado. ₃Como são felizes os irmãos que, com suavidade, conseguem restaurar e preservar a união. ₄Se nossa casa é o mundo, por que levantamos paredes? ₅Policiais nas ruas, muros levantados, janelas e portas trancadas e aquela falsa, velha e boa sensação de liberdade. ₆Trancamos e assim ficamos protegidos dos “animais” selvagens. ₇Árvores cortadas, paredes levantadas e, na rua asfaltada, uma criança aprisionada, de cabeça abaixada, joga animada, ladrão e polícia."}, {"n": 44, "text": "O cheiro das flores em um campo florido ou o cheiro angustiante da poluição nas grandes cidades? ₂O som da chuva e dos trovões ou o barulho dos carros e dos aviões? ₃O toque suave do vento ou os empurrões na entrada do metrô? ₄O gosto doce do mel ou o gosto amargo do fel? ₅O abraço amistoso de um irmão ou um soco no meio de uma confusão? ₆Os bons pensamentos trazem uma sensação de paz e alegria. ₇Os pensamentos negativos roubam a paz, fazendo qualquer “bom” humano chorar."}, {"n": 45, "text": "A escuridão não se torna luz da noite para o dia; é necessário que se construa uma história. ₂Controlar as emoções e quebrar as regras na fotografia são coisas que você deve aprender sozinho. ₃Eu vi dezenas de fotos da lua. ₄Quando pude contemplá-la pessoalmente, percebi que tudo que eu já havia visto era uma grande ilusão. ₅Desejo a sua presença da mesma forma que uma abelha anseia pelo mel. ₆Segundos de verdade valem mais que uma vida de saudade. ₇Fecho os meus olhos e te vejo, abro os meus olhos e te desejo."}, {"n": 46, "text": "Se a minha existência na terra acabasse agora, o que os outros humanos encontrariam na minha casa? ₂O que eu tenho pode revelar quem eu sou; o que eu sou pode revelar o que eu tenho. ₃Tudo depende dos olhos de quem vê. ₄Somos todos potes transparentes de vidro, e deixá-lo assim é uma escolha individual. ₅Se a sua existência na terra acabasse agora, o que os humanos encontrariam no seu pote de vidro? ₆A morte chega, o pote se quebra e todo o conteúdo some. ₇No final, seremos o que temos e não o que somos."}, {"n": 47, "text": "Quem perde a visão, aguça a audição e, assim, pode vir a ver e ouvir com o coração. ₂Não julgue a capa pelo livro. ₃Tem mais valor a capa ou o livro? ₄Quanto vale uma capa sem livro? ₅Quanto vale um livro sem capa? ₆Com os olhos fechados, eu abro a minha mente e com a mente aberta, eu recebo asas. ₇Engana-se quem pensa que aquele que fecha os olhos fica no escuro."}, {"n": 48, "text": "Quem se joga em alto mar e não nada, afunda. ₂Sábio não é aquele que faz mais coisas ao mesmo tempo. ₃Sábio é aquele que se doutrina e começa a fazer uma coisa de cada vez. ₄Aquele que foca somente em um assunto e desfoca todo o restante, acaba por perder a noção do todo. ₅Deixe tudo nítido e bem exposto — só depois foque no assunto a se destacar. ₆O controle total só pode ser obtido no modo manual. ₇Aprenda a nadar fora e dentro d'água."}, {"n": 49, "text": "Quem aprende pela necessidade merece aplausos. ₂Quem busca aprender o que não lhe é necessário no momento merece um aperto de mãos. ₃Começamos como água e, se seguirmos o caminho natural, terminaremos como rocha. ₄Abrir a mente implica em entender que, talvez, o universo seja o nosso lar. ₅O tempo bate palmas para a velocidade. ₆A velocidade não pode parar para apertar as mãos do tempo. ₇Aprenda observando um caracol."}, {"n": 50, "text": "O bom mestre, antes de ensinar, observa o aprendiz. ₂O conhecimento só deverá ser transmitido, posteriormente, à observação. ₃Após ensinar, observe mais uma vez. ₄Em seguida, faça junto e, se necessário, pegue nas mãos do aprendiz. ₅Observe mais uma vez. ₆Encontre possíveis erros e corrija-os. ₇Repita o processo quantas vezes forem necessárias."}, {"n": 51, "text": "Os meus dias são mais felizes quando contemplo o nascer e o pôr do sol. ₂Estou aprendendo que a verdadeira contemplação toca a alma. ₃A contemplação vem de dentro para fora. ₄O contemplado é como um espelho, que reflete a alma daquele que contempla. ₅Para contemplar, é necessário estar presente. ₆A presença constante é como a água da chuva, que apaga uma fogueira aos poucos. ₇Estou com saudade da chuva."}, {"n": 52, "text": "Os ensinamentos simples são os mais difíceis de serem absorvidos e, principalmente, de serem colocados em prática. ₂O choro rega as raízes da alma. ₃Depois da chuva, o mundo ganha um brilho todo especial. ₄Permita-se ser molhado pelas lágrimas do mundo. ₅Correr da chuva ou correr na chuva? ₆Qual foi a última vez que, por escolha, correste na chuva? ₇O mundo tem chorado pouco. ₈Lhe deixo um conselho — chore; chorar faz bem."}, {"n": 53, "text": "Todo aquele que começa a escrever, mais cedo ou mais tarde, cometerá um erro. ₂Quando o erro for cometido, não tente apagá-lo; destaque-o e continue a escrever. ₃Tenho encontrado mais beleza nos rascunhos do que no escrito final. ₄A beleza dos humanos está nas suas imperfeições. ₅Uma das maiores im’perfeições da vida é que ela acaba. ₆A imperfeição mostra o caminho para a beleza. ₇Qual é a sua im’perfeição?"}, {"n": 54, "text": "A natureza me ensina a gostar da solidão. ₂Os humanos me ensinaram o que é solidão. ₃A solidão me ensina o valor das verdadeiras amizades. ₄Os humanos me ensinaram o que é amizade. ₅A amizade me ajuda a encontrar pureza no olhar dos animais. ₆Os humanos matam animais. ₇Deveríamos aprender mais com a natureza."}, {"n": 55, "text": "A solidão pode ser sua melhor amiga. ₂Em vez de esperar por um abraço, que tal, hoje, ser aquele que oferece o abraço? ₃Em vez de esperar que outros plantem árvores, que tal, hoje, você ser aquele que planta? ₄Aprenda a apreciar a solidão. ₅Faça da solidão a sua melhor amiga. ₆Entenda que solidão não quer dizer estar sozinho. ₆Tantas imagens e mensagens, uma infinidade de conexões — nos conectamos com todos e, por vezes, não nos conectamos com nós mesmos. ₇A solidão pode ser sua pior inimiga."}, {"n": 56, "text": "Acordar tarde com propósito é melhor do que acordar cedo e não ter nada para fazer. ₂Existe muito prazer no descanso merecido. ₃Correr sem motivo é como construir um banco no meio de um lago. ₄Dormir cansado é a melhor forma de acordar animado. ₅Não se esqueça de que movimento gera movimento. ₆No dia em que você estiver desanimado e sem ânimo para se movimentar, procure pessoas que estão em movimento. ₇Aproveite a vitalidade que existe em seu corpo e no corpo das outras pessoas. ₀Logo passará!"}, {"n": 57, "text": "A inteligência rouba o brilho da ingenuidade. ₂A perfeita sabedoria inspira a contemplação. ₃Como seria incrível ver o céu estrelado, como se fosse a primeira vez. ₄Fico maravilhado e assustado com o brilho cintilante das estrelas em meio à escuridão. ₅A escuridão destaca o brilho das estrelas. ₆As estrelas não perdem o brilho só porque eu não consigo vê-las. ₇Só consigo ver o brilho das estrelas quando a escuridão aparece."}, {"n": 58, "text": "Entenda que mesmo quando você achar que não está jogando, você estará! ₂Você pode receber um jogo pronto e só o aperfeiçoar à sua maneira. ₃Você pode criar seu próprio jogo e fazer outros humanos jogarem. ₄Você pode ser apenas um player, seguindo as regras dos jogos de outros. ₅Se acha que pode viver nesse mundo sem fazer parte de um jogo, você está tremendamente enganado. ₆Você não apertou o start, mas tenho a certeza de que não quer apertar o stop. ₇Se todos morressem, minha existência perderia o sentido."}, {"n": 59, "text": "A infância é revestida de uma beleza que beira a perfeição. ₂Na infância, somos seres completamenteincompletos; e é aí que está a beleza. ₃A ingenuidade é o mais próximo da perfeição. ₀O humano que entendeu o jogo da vida, já tem seu lugar no paraíso. ₄Nós nos afastamos da perfeição a cada novo respirar. ₅O silêncio faz o tempo parar. ₆Está ouvindo? Tic-Toc (5) - Tic-Toc (10) - Tic-Toc (15) - Tic-Toc (30) - Tic-Toc (60). ₇Desligue o relógio!"}, {"n": 60, "text": "A vida é mais bela com perfumes. ₂A vida é mais bela com abraços. ₃A vida é mais bela com músicas. ₄A vida é mais bela com amigos. ₅A vida é mais bela com’tinue."}, {"n": 61, "text": "Observar o crescimento de uma semente é de uma preciosidade. ₂A semente é como uma criança; no início, você terá que cuidar e, em determinado momento, ela caminhará com suas próprias raízes. ₃Quem planta uma árvore frutífera, precisa entender que os seus frutos devem ser compartilhados com os humanos e, principalmente, com os animais. ₄Os muitos frutos podem gerar e preservar novas vidas ou simplesmente apodrecer. ₅Dez anos para plantar e colher — sessenta segundos para derrubar e desfrutar. ₆Entre em harmonia com a natureza — aprenda quando, onde e por que plantar e, principalmente, quando, onde e por que cortar. ₇Podemos aprender muito com os índios."}, {"n": 62, "text": "Certa vez, seguindo um caminho sob o sol escaldante das três da tarde, parei em uma sombra para conversar com ela. ₂Após uma conversa inesquecível e muitíssimo agradável, segui o meu caminho. ₃Depois de alguns passos, senti um doce aroma. ₄Dois passos para frente e o aroma cessou. ₅Dois passos para trás, e pude “senti-la” novamente. ₆Entendi, então, que o que realmente importa, não é o destino ou o caminho. ₇São as paradas que fazemos durante a jornada, as pessoas que conhecemos, e os momentos que realmente vivemos."}, {"n": 63, "text": "A inspiração pode ser comparada ao aroma doce e suave de um campo florido. ₂Por vezes, passo por esse campo e penso como seria incrível fazer desse lugar minha morada. ₃Ou será que, sendo morada, o incrível começaria a se tornar normal? ₄É necessário sentir saudade! ₅Eu aprendi a gostar de sentir saudade? ₆É preciso apreciar a falta, contemplar a presença e saber dizer adeus. ₇Tenha seus próprios pensamentos e faça suas próprias escolhas, pois essa é a base do despertar."}, {"n": 64, "text": "O tempo, estar presente e vivenciar o momento presente. ₂Não basta tirar parte do seu tempo, da sua vida, do seu presente. ₃Não basta estar presente fisicamente. ₄O melhor presente, sempre será vivenciar o momento presente."}, {"n": 65, "text": "Humanos pagam para malhar o corpo. ₂Os resultados podem ser vistos e são compartilhados. ₃Mãos calejadas, músculos enormes, corpos sarados. ₄Como seria o mundo se os humanos tirassem uma hora do dia para calejar suas mãos, ajudando ao próximo? ₅Os músculos cresceriam naturalmente, o corpo ficaria sarado e a alma, sarada. ₆Atos valem mais que palavras? ₇A resposta está no equilíbrio."}, {"n": 66, "text": "Comecei a cuidar de plantas. ₂Durante a noite, encontrei aquele que se alimentava das “pobres” plantinhas. ₃Agora, me pergunto: o que fazer com ele? ₄Devo matá-lo e, assim, defender as plantas; espantá-lo; ou deixar que ele se alimente livremente? ₅É justamente nesse momento que ganho poderes de Deus. ₆Posso deixar que o livre-arbítrio flua normalmente, ou posso interferir, favorecendo assim uma das partes. ₇O que você faria? ₈Com grandes poderes, vêm grandes..."}, {"n": 67, "text": "A alma do vento é livre! ₂A alma do vento não tem dono! ₃Achamos que sabemos sobre o vento, esquecemos que nós somos o vento. ₄Ele pode vir e trazer alívio ou vir e levar tudo. ₅Ninguém pode acalmar o vento! ₆Mesmo sabendo da iminente e cruel consequência, continuamos  tentando, em vão,  silenciar o mundo. ₇Desejo conhecer a alma do vento."}, {"n": 68, "text": "Evoluir não significa se tornar melhor que os outros; significa voltar ao estado original das coisas. ₂Somos todos bons, até o momento em que precisamos fazer o mal. ₃Fazer o bem todos podem; sentir prazer em fazê-lo mostra o que há dentro do coração de um homem. ₄Se o ano novo fosse sempre amanhã, mais promessas seriam cumpridas? ₅Se o Natal fosse sempre no dia seguinte, mais pessoas seriam ajudadas e presenteadas? ₆O “Amor” permaneceria no ar por mais tempo — ou será que daríamos um jeito de estragar tudo? ₇O que você gostaria que sempre voltasse no dia seguinte?"}, {"n": 69, "text": "A humanidade hospeda uma doença, e a mesma humanidade tem a cura. ₂Não é crime um humano ter mais que o outro; porém, é um sintoma da doença quando um humano sente prazer no poder de ter mais que o outro. ₃Desejamos mais de vinte e quatro horas porque criamos ídolos e nos entretemos. ₄Aprecie tudo pela última vez, antes que acabe. ₅A doença ainda não chegou ao ápice e, por isso, não nos matamos todos. ₆Qual ser inteligente, possuindo a cura da sua doença, não a usaria agora? ₇Eu chorei, ouvindo Deus cantar — Até breve!"}, {"n": 70, "text": "Acredite no Amor, pois Ele ainda mudará o mundo."}, {"n": 71, "text": "Não aproveitamos todos os presentes porque achamos que amanhã sempre terá mais. ₂Dentro do presente, recebemos pequenos grandes presentes. ₃Se você deixar, a repetição transformará o espetacular em normal. ₄Será que os moradores de São Thomé aplaudem o pôr do sol todos os dias? ₅Será que a presença constante é tão destrutiva assim? ₆Tenho que aprender a apreciar e aplaudir o espetáculo da vida como se fosse a última música. ₇Não vemos as coisas como elas realmente são; vemos como somos. ₀O presente é sempre único e particular."}, {"n": 72, "text": "Uma planta de sol pleno jamais chegará ao seu esplendor estando na sombra. ₂Uma planta de grande porte em um vaso pequeno; uma planta de porte pequeno em um vaso grande. ₃Em qual vaso você está? ₄Em qual vaso gostaria de estar? ₅Por vezes, as raízes só precisam de espaço para se movimentarem, de forma livre e natural. ₆Ajude plantas a encontrarem o seu vaso. ₇O planeta Terra é um grande vaso. ₈Você está plantado na terra ou no vaso?"}, {"n": 73, "text": "O construtor de um palácio raramente morará no mesmo. ₂Fico confuso, ao pensar, que quem ajuda na construção de um palácio pode não ter um lugar para repousar. ₃Fico ainda mais confuso quando vejo alguns humanos com tantos palácios vazios. ₄Como conseguimos dormir à noite sabendo que muitos irmãos têm como teto a luz da lua e das estrelas? ₅O seu palácio é o mundo, e eles continuam a levantar paredes. ₆Palácios podem ser construídos em seis dias com apenas uma palavra: união. ₇Todos deveriam aprender a construir palácios."}, {"n": 74, "text": "Os estados mais elevados só serão alcançados quando você estiver em paz consigo mesmo, com os outros humanos, com os animais e com a natureza. ₂A paz é o princípio da guerra; mesmo assim, escolherei estar em paz, sempre! ₃Quando fizer as pazes com o Universo, ele se tornará o seu melhor amigo. ₄O universo é seu pai e não deixa de ser seu amigo; é sua mãe e não deixa de ser seu amigo; é tudo e não deixa de ser seu amigo. ₅Seja um amigo verdadeiro do universo, e o todo sorrirá para você. ₆Seja amigo de tudo e de todos. ₇Não fique apenas esperando por sorrisos."}, {"n": 75, "text": "Existem momentos em que, mesmo subindo ao ponto mais alto, você não conseguirá ver tudo. ₂Ao subir, o que você deseja ver? ₃Você não enxergará um pôr do sol à meia-noite. ₄Qual é a sua busca durante a caminhada? ₅Talvez a beleza esteja escondida por detrás da neblina, ou talvez a beleza seja a própria neblina. ₆Existe alguém esperando para caminhar com você. ₇Não deixe a correria impedir você de caminhar."}, {"n": 76, "text": "Não se deixe levar pelos padrões que são criados, mesmo sem você perceber. ₂Sete é o número da perfeição, mas não se esqueça: existem outros números. ₃Quando a reta começar a ficar longa demais, cogite a possibilidade de construir um novo caminho. ₄Se você quer fazer uma caminhada de cinquenta quilômetros ao final do ano, durante o ano treine caminhando por cem quilômetros. ₅Não caminhe sempre sozinho. ₆Não caminhe sempre acompanhado. ₇Esteja atento, pois os padrões são criados sem que você perceba."}, {"n": 77, "text": "Saiba que é no calor que se aprende o valor do frio. ₂Será que é preciso estar no inferno para valorizar o céu? ₃A natureza está chorando, mas não conseguimos ver suas lágrimas. ₄A mesma chuva que tanto clamamos provocou um dilúvio. ₅Quantidade é diferente de intensidade. ₆O céu não está mais azul e as nuvens desapareceram. ₇Que não desapareça também a nossa esperança."}, {"n": 78, "text": "Não aflija o seu coração tentando, em vão, abraçar o mundo. ₂Só cabe uma pessoa no seu abraço total. ₃Tome cuidado, pois depois de cantar para milhares de pessoas, talvez você não veja mais graça em cantar para apenas uma. ₄O brilho no olhar não se compra, se conquista! ₅Como está sendo a sua jornada? ₆Sentir paz é como aprender a flutuar pela primeira vez. ₇Se os seus olhos forem bons, você será capaz de distinguir entre a luz e a escuridão."}, {"n": 79, "text": "Lá fora, existem pessoas fazendo coisas que você nem imagina. ₂O que você só tem feito no escuro? ₃Como é angustiante ver atos de maldade sendo cometidos de forma consciente, por puro prazer. ₄A luta do bem contra o mal pode não ser visível no mundo físico, mas não duvide: ela está acontecendo! ₅Vendendo seus corpos por poucos trocados… ₆Todos os seus atos contêm bênção e maldição. ₇Bênção! Que Deus te abençoe!"}, {"n": 80, "text": "O local por onde você caminhar poderá ditar como será sua experiência durante o percurso. ₂As pessoas que encontrar(á), as pessoas com quem caminhar(á), o que ouvir, o que falar, o que escrever, o que provar, o que sentir, etc. ₃A sua caminhada é como sua digital. ₄Durante sua jornada, pessoas te seguirão e deixarão de seguir. ₅Algumas pessoas te seguirão por mais tempo e por motivos diferentes. ₆O grande ensinamento é que, querendo ou não, em alguns momentos você terá que continuar sozinho. ₇Solidão e silêncio são professores. ₈A vida é como a faculdade: você pode entrar e sair da sala quando quiser, e também pode trocar de curso no momento que bem preferir. ₉Não tenha medo de sair do curso de medicina no último ano. ₀A caminhada é sua!"}, {"n": 81, "text": "Jogando a terra para fora, o buraco nunca será menor que antes. ₂Cada passo, por mais simples e pequeno, te aproxima do destino desejado. ₃Sempre em frente é o conselho que eu te dou. ₄Primeiramente, visualize a casa pronta e só depois compre o primeiro tijolo. ⁵Começar sem visualização é possível e, por vezes, necessário; porém, não é o mais aconselhável. ₆A visualização tem o poder de fazer com que o futuro seja vivido, sentido e apreciado no presente. ₇VisualizAÇÃO."}, {"n": 82, "text": "Por pelo menos alguns segundos, durante o dia, pare e, de olhos abertos, faça com que o seu tudo se torne nada. ₂Consiga se olhar de fora para dentro. ₃Faça isso mesmo que esteja parado no topo de uma montanha silenciosa. ₄Eu não sou, eu estou! ₅Estando em uma montanha, você não poderá nadar em uma piscina, mas poderá visualizar a ação. ₆Os lugares influenciam suas visualizações. ₇A ação é o combustível que te leva a descer à montanha para nadar na piscina."}, {"n": 83, "text": "Ao final do dia, deveríamos sorrir e chorar. ₂Existe magia por todos os lados; se permita enxergá-la. ₃Durante a jornada, começamos a perceber que não se trata de correr ou caminhar. ₄Entendemos que a beleza está em aprender em quais momentos correr e em quais momentos caminhar. ₅Um bom ator vê as câmeras como parte do palco. ₆A morte é apenas um corte de câmera. ₇A única certeza ou esperança é que a vida sempre continua. ₈Aproveite o seu presente, seja chorando ou sorrindo."}, {"n": 84, "text": "Se para me elevar for necessário algo exterior ao meu corpo e mente, terei falhado! ₂Meus sentidos, quando provocados, me impulsionam a subir a montanha. ₃Quando eu estiver no topo, parado e em silêncio, se o meu coração não vibrar, terei falhado! ₄Não é necessário nem aconselhável que se suba sozinho; porém, esteja sempre pronto para seguir. ₅Lembre-se de que não são todos que alcançam o topo. ₆Seja grato pelas canções que, cantadas ao universo, chegarem até aos seus ouvidos como uma brisa suave trazida pelo vento. ₇Quanta magia eu deixaria de receber se você não estivesse aqui comigo. ₈Não existe um mapa que nos indique ao certo para onde estamos indo, mas se eu pudesse deixar um atalho para aqueles que ainda não começaram a subir, escreveria lentamente, com o dedo na areia: SEJAGRATOECOMPARTILHE!"}, {"n": 85, "text": "Ao entregar um carrinho sujo, não espere recebê-lo limpo. ₂Se você emprestar o carrinho limpo e ele voltar sujo, não plante o pensamento de “ele me enganou”. ₃Fique em paz por saber que a sua parte foi bem feita. ₄Um pedreiro bom pode deixar suas ferramentas sujas. ₅A sujeira acumulada é mais difícil de ser retirada; além disso, pode deixar marcas que a água comum não possui o poder necessário para remover. ₅Se você não ficasse sujo, o banho não seria necessário. ₆Por que você toma banho? ₇Já tomou banho hoje?"}, {"n": 86, "text": "Respire fundo mais vezes e quantas vezes for necessário. ₂Converse consigo mesmo em alta voz. ₃Visualize o tempo todo, faça planos, crie novos projetos, sonhe de olhos abertos. ₄A ação é o combustível da alma. ₅Mexa-se, mantenha o foco e faça uma coisa de cada vez. ₆Não se preocupe com o tempo; apenas continue. ₇Quando se tem silêncio, se tem mais tempo, e isso, às vezes, incomoda."}, {"n": 87, "text": "Corra todos os dias, mesmo sem querer ou precisar. ₂Reserve um tempo para conversar consigo mesmo. ₃Escreva seus pensamentos. ₄Compre uma barraca. ₅Viaje para um lugar que faça o seu coração vibrar. ₆Olhe mais para as estrelas. ₇Agradeça!"}, {"n": 88, "text": "Estude espanhol. ₂Converse com pessoas que falam espanhol. ₃Fale pouco e ouça mais. ₄Agradeça quantas vezes for necessário. ₅Demonstrações de carinho sempre serão bienvenidas. ₆Converse com pessoas que falam inglês. ₇Estude inglês."}, {"n": 89, "text": "Correu ontem? Sim! Ok, não se vanglorie por fazer apenas o previsto. ₂Faça contato com um amigo do passado. ₃Cinquenta flexões. ₄Dez minutos de meditação. ₅Dois litros de água. ₆Duvido que você consiga fazer tudo isso no mesmo dia. ₇Me prove o contrário!"}, {"n": 90, "text": "A chuva não vem para atrapalhar os seus objetivos. ₂A chuva vem para provar o quão focado e disposto você realmente está. ₃Se é para correr, corra na chuva! ₄Se é para falar com um amigo, faça! Se a internet do mundo acabar, ligue, escreva uma carta, caminhe até ele, mas faça! ₅Não invente desculpas, crie soluções! ₆Até quando você será o seu pior inimigo? ₇Cada “não” que você diz para as suas vontades te aproxima de quem você deveria ser."}, {"n": 91, "text": "Eis que é chegado o tempo de encerrar ciclos. ₂Tenha sabedoria ao iniciar novos ciclos. ₃O que você está procurando só será encontrado em novos lugares, com novas pessoas, novas conversas, novas ideias e novos movimentos. ₄Entenda que, talvez, seja estranho e um tanto quanto desconfortável sair do meio da multidão. ₅Mas fique tranquilo: você não está sozinho, logo outros também sairão. ₆Se sua forma de agir for boa, todo o seu corpo será luz. ₇Uma luz que brilha o tempo todo, incomoda."}, {"n": 92, "text": "A existência é perfeita em sua totalidade. ₂Se aqui chove, em outro lugar o sol brilha. ₃Se aqui estou inspirado e sorrindo, logo ali alguém sofre e chora. ₄A beleza está nos olhos de quem vê, de quem sente, de quem realmente vivencia o momento, seja ele qual for. ₅Por mais que você ainda não possa entender, saiba que existe beleza onde você está. ₆A maior beleza será vista através do seu olhar. ₇Existe beleza em você."}, {"n": 93, "text": "Grandes construções precisam de um checklist bem organizado. ₂É fácil desanimar ao pensar que ainda faltam cinco, dez ou trinta anos. ₃Concluindo pequenas tarefas, você se sentirá revigorado, pronto para seguir em frente. ₄Você nunca estará mais longe se continuar caminhando em direção ao seu propósito. ₅Vislumbre o final antes de começar. ₆Se você acha que já passou do tempo, escolha vários finais. ₇Você terá outras oportunidades/vidas para fazer acontecer."}, {"n": 94, "text": "Quando as coisas estiverem dando errado, faça a si mesmo as seguintes perguntas: O que está dando errado? O erro é meu? Como posso resolver? ₂Se o erro for completamente seu, abaixe a cabeça e faça o possível e o impossível para resolvê-lo. ₃Se o erro não for seu, respire fundo e tente encontrar uma solução passiva. ₄Você cria os seus problemas!"}, {"n": 95, "text": "Não se apegue ao que você fez ou viveu ontem. ₂Se alguém aparecer aqui do nada, ela não saberá o que você fez ontem; ela se importará com o que você está fazendo no presente. ₃O que se fez, se viveu, se foi — só se torna importante quando alguém conta uma história. ₄Se o leão ficar só pensando nas caças do passado, ele morrerá de fome. ₅Se o leão, durante a caça do presente, começar a pensar na caça do amanhã, ele morrerá de fome. ₆O leão tem que se concentrar na caça do aqui e do agora. ₇Toda manhã, na África, um leão e uma gazela acordam..."}, {"n": 96, "text": "A constância sempre vencerá a intensidade. ₂Não adianta fazer quatro vezes mais em um dia e depois ficar parado no dia seguinte. ₃Seja um por cento melhor todos os dias, mesmo depois de alcançar os cem por cento ₄A primeira tarefa do dia deve ser arrumar sua cama. ₅Antes de se levantar, por alguns segundos, agradeça. ₆Levantar cedo é difícil, malhar é difícil, estudar é difícil; porém, os resultados serão colhidos com o tempo. ₇Os frutos da constância e da disciplina são o sucesso e a excelência."}, {"n": 97, "text": "Podemos aprender o que quisermos; o querer é o maior desafio. ₂Sábio não é aquele que compra milhares de livros e monta uma superbiblioteca. ₃Sábio é aquele que absorve um livro por vez. ₄Livro a livro, você montará uma biblioteca. ₅Não perturbe o seu coração com a biblioteca que está no futuro. ₆Leia seu livro com calma, aproveitando com intensidade o momento presente. ₇Escreva seu próprio livro!"}, {"n": 98, "text": "Que sejamos como um filtro diante do mundo e dos seres que nele habitam. ₂Uma garrafa de álcool, quando reciclada, pode se tornar uma garrafa de água. ₃Como você tem recebido o que o mundo lhe oferece? ₄Que minhas ações e palavras tenham um aroma suave, que sejam mais doces do que o puro mel. ₅Que eu encontre sabedoria no movimento e paz no silêncio. ₆Que minhas ações possam brilhar na escuridão e permaneçam acesas durante o sol do meio-dia. ₇Como será que o mundo recebe o que você tem para oferecer?"}, {"n": 99, "text": "O frio do corpo ameniza-se com agasalhos, mas o frio da alma é um grande perigo. ₂Ajude com dinheiro e bens materiais, mas lembre-se de que existem pessoas que só precisam de uma dose de amor. ₃O mundo é gigante, mas o seu tamanho real depende do tamanho que temos. ₄Quando nos limitamos ao corpo, temos o tamanho do corpo. ₅Quando nos vemos como alma, tornamo-nos infinitos. ₆Quem cuida do corpo dignifica a alma. ₇Quantos centímetros você cresceu hoje?"}, {"n": 100, "text": "Você observa se há óleo antes de colocar a panela no fogo? ₂Você observa se há alho antes de colocar o óleo? ₃Você observa se há arroz antes de colocar o alho? ₄Você observa se há água antes de colocar o arroz? ₅Você observa se há um botijão reserva antes de fazer tudo isso? ₆Você sabe trocar o botijão? ₇Você come arroz todos os dias? ₈Já preparou arroz na panela de pressão?"}, {"n": 101, "text": "Se você pescou de forma intensa durante seis dias e só no último dia conseguiu uma pesca abençoada, basta! ₂Descanse no sétimo dia. ₃Aproveite o descanso e retome sua intensidade no dia seguinte. ₄Existe muito prazer no descanso merecido. ₅Sinta prazer em transcender prazeres pontuais que te aprisionam. ₆A repetição forja o assassino. ₇O que você precisa matar hoje?"}, {"n": 102, "text": "Estou no buraco, perguntando-me: o que fazer para sair dele? ₂Ao se concentrar no buraco, todo o seu derredor contribuirá para que ele esteja sempre com você. ₃Você no buraco e o buraco em você. ₄Entenda que você pode estar fora do buraco — mas, ainda assim, o buraco pode continuar dentro de você. ₅Foi mais fácil tirar o povo de Israel do Egito do que tirar o Egito de dentro do coração do povo de Israel. ₆Ao se concentrar no buraco, ele se torna um fim, e todo o restante se torna uma grande utopia. ₇Você até acha que deseja sair do buraco, mas, lá no fundo, você não tem ideia do que te espera lá fora. ₈Isso te assusta? ₉Dentro do buraco, você olha para baixo e vê o finito; ao olhar para cima, você contempla o seu infinito."}, {"n": 103, "text": "Visualize o que te espera fora do buraco. ₂Se imagine sentindo, vivenciando e desfrutando de tudo o que te espera. ₃Faça sua parte e grite por socorro pelo menos uma vez por dia. ₄Uma corda será lançada. ₅Você terá forças para subir? ₆Quem não estiver preparado olhará para a corda e chorará. ₇Esteja preparado a tempo e fora de tempo."}, {"n": 104, "text": "Primeiro, você terá que gerar confiança, perder a timidez, expor ideias e testar muito. +/- ₂Se permita sentir saudade. ₃Terceiro, solidificar a confiança, se sentir mais à vontade, repetir as ideias que deram certo, acrescentar novas ideias e testar pouco. -/+ ₄Se permita sentir saudade! ₅Quinto, a confiança foi estabelecida, a timidez deu lugar à fluidez, você tem total liberdade para repetir e acrescentar. +/+, -/- ₆Não tenha medo de começar. ₇Quando a sua conta estiver com vários zeros na frente do um, você se lembrará com alegria do primeiro. ₀Zero também é número."}, {"n": 105, "text": "Não deixe a garrafa ficar vazia. ₂Quando se levantar à noite e sentir fome, beba água. ₃Antes de voltar a dormir, dobre os joelhos e agradeça a Deus. ₄Antes de se deitar, respire fundo algumas vezes e escute o silêncio. ₅A madrugada tem um poder inigualável, mas tenha cuidado para não se esbaldar, pois ela pode ser perigosa. ₆Faça o que tem que ser feito, mesmo que o seu corpo não queira. ₇Quando a ansiedade bater à porta, imagine que você acordou de madrugada; beba água e complete a garrafa."}, {"n": 106, "text": "Não corra contra o vento! ₂Você já viu uma receita de um ingrediente só? ₃Encontre formas de agradecer por seus microresultados. ₄Crie desafios que o impulsionem. ₅Desafie outra pessoa e vocês dois serão impulsionados. ₆No momento certo você irá transcender. ₇Corra a favor do tempo!"}, {"n": 107, "text": "Se eu me apegar a todos os banhos quentes que já tomei, jamais tomarei o primeiro banho gelado. ₂Se eu me apegar a todas as manhãs em que acordei às nove horas, jamais terei força de vontade para acordar às quatro. ₃Se eu achar que estou velho demais para começar um projeto novo, jamais viverei como se fosse a primeira vez. ₄Viva como se fosse a primeira vez! ₅O apego cria pessoas dependentes. ₆Você não é o banho quente, não é o acordar às nove horas, não é velho, não é o seu emprego, seu cargo ou sua profissão. ₇Quem é você?"}, {"n": 108, "text": "Por que orar, sendo que Deus já sabe o que tenho para pedir? ₂A oração é a confirmação da intenção do meu coração. ₃Aquele que tem e transborda, mais lhe será acrescentado. ₄Concentre-se em seus sonhos e objetivos e tenha a certeza de que eles estejam claros e alinhados com o seu propósito. ₅Quando tiver a oportunidade de se deliciar com o néctar da vida — faça-o com o coração aberto, tanto para receber quanto para doar. ₆Sem Deus, o homem não pode, mas sem o homem, Deus não faz. ₇Você só precisa orar!"}, {"n": 109, "text": "Eu sei por que você não realiza os seus sonhos. ₂Você desiste antes mesmo de chegar ao meio do caminho. ₃Você coleciona sonhos que nunca saíram do papel. ₄Você culpa pessoas e circunstâncias, e sempre espera que terceiros resolvam os problemas que são seus. ₅Apenas faça o que tem que ser feito. ₆Siga o seu instinto e esteja sensível para ouvir a voz de Deus. ₇Uma pedrinha de cada vez."}, {"n": 110, "text": "A conquista requer tempo e dedicação. ₂Uma das chaves se chama paciência. ₃Você não sabe quanto tempo resta até o final da festa. ₄Aproveite cada música — dance, pule, grite e descanse. ₅Faça com que o relacionamento seja leve. ₆Há certos caminhos que parecem perfeitos ao homem, mas quem os segue acabará encontrando a morte. ₇Conquiste com sabedoria!"}, {"n": 111, "text": "Não guarde em seu coração paixões apodrecidas. ₂Sem sua paixão, você não é nada? ₃Parabéns, você não passa de um escravo! ₄Você não é a sua paixão! ₅Não deixe que os erros do passado tirem a paz do seu coração. ₆O cheiro da podridão será o seu aviso de “pare”. ₇Só ser livre não é o bastante. ₈Seja o canal para que outros também se libertem."}, {"n": 112, "text": "Melhore pelo menos um por cento todos os dias. ₂Por pensar muito na dificuldade de se construir um palácio, nunca assentou o primeiro tijolo. ₃Você pode mudar! ₄Quando estiver frente a uma grandiosa montanha de lixo, respire fundo e apenas comece a limpeza. ₅Você não terminará hoje, nem amanhã; talvez nem daqui a um ano. ₆Continuando em movimento, você sempre estará mais próximo do fim. ₇De tempos em tempos — faça pequenas mudanças conscientes em todos os seus pilares."}, {"n": 113, "text": "Quando for possível, caminhe às quatro horas da manhã. ₂Faça flexões ao acordar, ao meio-dia, antes de dormir e antes de qualquer refeição. ₃Dobre os joelhos e fale com Deus ao se levantar e antes de se deitar. ₄Peça e agradeça! ₅Tome três banhos gelados durante o dia — após caminhar pela manhã, duas horas depois do almoço e também à noite, um pouco antes de se deitar. ₆Digitalize capítulos do seu livro. ₇Coma coisas saudáveis e tome muita água. ₈Quando se sentir desanimado, faça flexões e movimente o seu corpo. ₉Não fique parado no tempo!"}, {"n": 114, "text": "Faça sempre mais do que o proposto. ₂Fazendo pelos outros, você estará fazendo por você; isso abrirá as portas do céu e moverá o coração de Deus. ₃Tire o galho do caminho, mesmo que você esteja em uma moto e consiga passar sem nenhuma dificuldade. ₄Arrume o quarto da pousada da mesma forma que arruma o seu quarto. ₅Cada pessoa deveria lavar o seu prato no restaurante. ₆Cuide do seu corpo da mesma forma que cuidaria de uma mansão: limpe-a, faça reformas, corte a grama e faça festas. ₇Faça o que tem de ser feito, antes de começar a fazer o que você quer."}, {"n": 115, "text": "Os pequenos reparos realizados durante o dia serão primordiais para o seu descanso à noite. ₂Vinte e quatro horas é pouco? ₃Acorde de madrugada, saia para correr, faça abdominais, escute uma música que fará a sua alma chorar — You Say. ₄Certas coisas só serão feitas pela manhã ou mais tarde; portanto, não deixe que o amanhã tire o seu prazer pelo agora. ₅Faça o que poucos estão fazendo e, quando parar de esperar, conseguirá resultados que poucos estão conseguindo. ₆Sinceridade e respeito forjam amizades eternas, produzindo, assim, profunda admiração. ₇Seja sincero e tenha respeito com sua alma e seu corpo; seja o seu melhor amigo e sinta admiração por você mesmo."}, {"n": 116, "text": "Não aflija o coração com acontecimentos e pessoas que não irão lhe trazer retorno financeiro ou emocional. ₂Aplique movimento e invista tempo em quem quer correr com você. ₃Movimento gera movimento — pessoas movem pessoas. ₄Faça uma pequena caminhada antes de começar a correr. ₅Corra com quem quer correr com você. ₆A corrida não é eterna — sei que é difícil dizer adeus; porém, a vida é feita de ciclos e temporadas. ₇Não tenha medo de correr sozinho. ₈Tome um banho gelado depois da corrida."}, {"n": 117, "text": "O sentimento te domina quando quer, e isso te mata aos poucos. ₂Para encontrar harmonia, terei que orquestrar e reger meus sentimentos, pensamentos e ações. ₃Um grande lago com um banco no meio — o banco só tem lugar para uma pessoa por vez; se tivesse espaço para dois, você sempre sentiria falta de alguém, e isso te limitaria. ₄Há uma grande placa dizendo que você só pode se sentar no banco se tiver nadado até ele. ₅O caminho de volta também tem que ser feito a nado. ₆Em volta do lago, temos caiaques, barcos a remo e motorizados, jet skis e lanchas. ₇Não haverá ninguém para te obrigar a obedecer às regras; ou seja, você estará totalmente livre. ₈Seja justo com você mesmo e aprenda a nadar dentro e fora da água. ₉Cada sentimento é um lago, cada pensamento é um banco, e cada ação é uma pessoa nadando até o meio."}, {"n": 118, "text": "Você é o que faz quando tudo está dando muito errado ou muito certo. ₂Se estiver preso e tiver que quebrar pedras, encare isso como um treino, um preparo; quebre as pedras como se estivesse malhando o corpo e a mente. ₃Seja duro como a rocha e maleável como a água. ₄Noventa e sete por cento de todas as respostas estão no movimento; os três por cento restantes você encontrará no silêncio. ₅Comece a correr sozinho, corra por si e para si. ₆Em algum momento, alguém, ou muitos, desejarão correr com você. ₇Quando sentir sono à tarde, saia para correr ou tome um banho gelado. ₈Leia o número quatro novamente e, na dúvida, saia para correr ou tome um banho gelado."}, {"n": 119, "text": "Querer sem movimento é uma atitude de tolo. ₂Se movimente em direção ao seu propósito definido. ₃Movimento sem propósito é como cavar um buraco dentro de outro buraco. ₄O que você realmente quer? ₅Só pensar em riqueza não te tornará rico, da mesma forma que caminhar até o lago não te levará ao topo de uma montanha. ₅Emoções e sentimentos geram pensamentos, que, por sua vez, geram ações, que geram reações, que geram resultados. ₆O que vem depois do resultado? ₇Você não é a mente e também não é o corpo. ₈O que você é? ₉Você é o que está criando o aqui e o agora. ₀Pense correndo ou, melhor, comece a pensar em movimento."}, {"n": 120, "text": "Ninguém fará por mim e, se fizerem, será como comer arroz sem sal. ₂Ninguém poderá sonhar por mim. ₃Uma vida sem sonhos é vazia, triste e melancólica. ₄Se você realmente ama tanto as outras pessoas, comece a sonhar por elas. ₅Não seja somente o melhor pescador, seja o melhor em ensinar a pescar. ₆Onde não encontrar um lugar para pescar, construa um lago. ₇Plante água e você colherá peixes; plante perguntas e você colherá sabedoria. ₈Nem toda a água é boa para beber."}, {"n": 121, "text": "Quem move uma moto move um carro. ₂Quem move um carro move um caminhão. ₃Quem move um caminhão move um avião. ₄Quem move um avião move um foguete. ₅Quem se move move outras pessoas. ₆Muitas pessoas juntas movem coisas. ₇O movimento é a razão de tudo."}, {"n": 122, "text": "Se eu te dei um presente, não quero um obrigado; quero outro presente. ₂Se te presenteei com meus pensamentos, não quero elogios ou críticas; apenas continue a conversa e me presenteie com seus pensamentos. ₃Onde te encontraria em uma manhã qualquer de domingo? ₄Qual conselho me daria? ₅Se pudesse me falar só uma coisa sobre você, o que seria? ₆A melhor forma de agradecer por um presente é usando-o. ₇Sinta-se feliz por presentear pessoas com o seu presente."}, {"n": 123, "text": "Sabe quem irá agradecer se você fizer o que tem que ser feito? ₂Seu corpo, sua mente, seu espírito, sua família, seus amigos e todos à sua volta. ₃Chega de desculpas! ₄Faça o que tem que ser feito! ₅Os frutos, o prazer e a recompensa não estão no início da corrida; estão no meio e no final. ₆Para existir um meio e um final, é necessário que exista um início. ₇Hoje é o melhor dia para começar."}, {"n": 124, "text": "Não seja escravo dos seus comportamentos. ₂Não se apegue a números, datas e dados. ₃Seja aquele que quebra, cria, derruba e ergue padrões. ₄Se você não for livre, no primeiro deslize, sucumbirá, voltando à estaca zero. ₅Seja senhor das suas fraquezas. ₆Seja capaz de escolher com disciplina o seu dia de descanso. ₇Aprenda sobre o poder do descanso merecido."}, {"n": 125, "text": "Qual a importância de ter seu nome lembrado em vida e depois da morte? ₂Viver o agora sem uma forte estrutura mental pode ser mais agoniante do que a depressão e a ansiedade juntas. ₃Esteja certo de que você terá que pagar um preço pelo seu despertar. ₄Despertar não significa abrir os olhos; significa abrir a mente e permitir uma reconexão com o todo. ₅Você não será feliz parado, não será feliz correndo e não será feliz esperando que eu lhe diga quando será a chegada da sua felicidade. ₆Cada caminho tem sua digital. ₇Desejo que você descubra e desfrute da bênção do agora."}, {"n": 126, "text": "Demonstre com ações e não só com palavras. ₂Cultive a amizade, pois dela sairão os mais belos frutos e gestos de amor. ₃O tempo normalmente é relativo; talvez você só precise de alguns segundos para escrever um para sempre. ₄Não se apegue ao corpo, aos nomes ou aos números, pois um dia eles passarão. ₅Apegue-se aos sentimentos, apegue-se ao momento presente e esteja certo de vivê-lo intensamente. ₆Coloque todo o poder dos seus sentimentos em ações — chore, grite, corra, escreva, abrace, movimente-se. ₇Você não sabe quanto tempo resta até o final da festa."}, {"n": 127, "text": "Quando o incrível começar a se tornar normal, afaste-se um pouco. ₂Permitir-se sentir saudade é uma das mais belas virtudes. ₃O majestoso banquete da vida não foi feito para encher a barriga, nem para ser consumido de forma rápida; foi preparado para ser apreciado em porções, deixando sempre um gostinho de quero mais. ₄Mesmo depois de ter o controle, permita que, em momentos pontuais, o dono da vida escolha o cardápio. ₅Qual será o cardápio de hoje? ₆Saiba que controlar a vida é como dirigir sem para-brisas no meio de uma tempestade. ₇É normal morar de frente para uma cachoeira e passar dias sem mergulhar."}, {"n": 128, "text": "Se você se elevou, é hora de ser professor e, assim, ajudar outras pessoas a encontrarem o seu próprio caminho. ₂Ao desejar o mesmo caminho que o meu, em algum momento, você se sentirá perdido e frustrado. ₃Encontre as suas próprias respostas e perguntas. ₄Em algum momento da vida, desejando ou não, você terá que ser autor. ₅Encontre o equilíbrio entre desfrutar e não se apegar. ₆Todas as respostas que você procura estão no caminho; continue caminhando. ₇Si leo tus enseñanzas, me pierdo de las mías."}, {"n": 129, "text": "Quando sentir que suas emoções foram abaladas por circunstâncias, ou por pessoas que tiveram permissão para levar sua paz, será um belo convite para que você se analise. ₂Pergunte a si mesmo: \"Por que isso está me afetando?\" ₃Não fuja do confronto, pois só é verdadeiramente forte quem luta contra suas próprias fraquezas. ₄Todos nascemos perdidos — quem não se dá conta disso jamais se encontrará. ₅Só o amor não é suficiente — é necessário ser amigo do criador do amor. ₆É necessário se perder para se encontrar. ₇Quando você se encontrar, haverá um transbordar emocional, e o mesmo trará um refrigério nunca antes sentido, não só para você, mas para todos."}, {"n": 130, "text": "Encontrar equilíbrio não quer dizer mudar quem você é, e seguir por outro caminho. ₂Encontrar equilíbrio significa entender quem você é, e ter clareza para onde está indo. ₃O poder do equilíbrio se compara a ter uma torre bem alta acompanhando você durante todo o caminho. ₄Antes de tomar decisões, você sempre poderá subir e vislumbrar o todo. ₅Quem sobe na mesa muda sua perspectiva e encontra clareza. ₆Aprenda e internalize a regra dos cinco segundos. ₇ASSISTA DESENHOS!"}, {"n": 131, "text": "Praticar é a melhor forma de aprender? ₂Quer aprender a construir uma casa? ₃Não leia um manual de instruções; seja ajudante de um pedreiro. ₄Mais vale uma pessoa que sabe construir uma casa do que duzentos homens fortes que não sabem nem por onde começar a construção. ₅Toneladas de concreto e milhares de tijolos não se levantam sozinhos. ₆O propósito definido, sem a busca do conhecimento para alcançá-lo, é praticamente inútil. ₇Aprender o que não lhe é necessário no momento é um grandioso ato de sabedoria. ₇Encontre equilíbrio entre inteligência e força."}, {"n": 132, "text": "Não hesite em fazer loucuras. ₂Acelere na subida. ₃Corra na chuva. ₄Não acredite em suas desculpas. ₅O descanso é necessário. ₆Compartilhe suas conquistas. ₇Crie e viva temporadas."}, {"n": 133, "text": "A oração repetida não muda em nada a atuação de Deus. ₂A repetição tem por objetivo manter a chama acesa dentro do seu coração. ₃Ao falar com Deus, repita em alta voz os seus planos e intenções. ₄Peça sabedoria, discernimento e direcionamento para entender o que deve ser mantido e o que precisa ser apagado. ₅Gastamos muita energia com coisas que só existem e não deveriam existir em nossa mente. ₆Seja realista! ₇Descanse em pastos de grama verde e macia."}, {"n": 134, "text": "Compartilhe o seu propósito de forma clara. ₁Não faça o que todos estão fazendo. ₂Faça mais do que os outros estão fazendo. ₃Não se preocupe com o que os outros estão fazendo. ₄Saiba o que os outros estão fazendo. ₅Simplifique ao máximo possível. ₆Não fique estacionado por muito tempo. ₇Melhore gradativamente. ₈Não falhe em seguir estes sete conselhos."}, {"n": 135, "text": "Quem é você quando ninguém te vê? ₂Já reparou que, no momento de uma fotografia, todos sempre estão sorrindo e cheios de poses de carinho e afeto? ₃O que realmente importa é o que somos na essência. ₄Quem é você com sua esposa? ₅Quem é você com seus filhos? ₆Quem é você com seus pais e amigos? ₇Quem é você quando não há uma câmera apontada em sua direção?"}, {"n": 136, "text": "Existe um mapa do tesouro. ₂Ninguém é portador do mapa completo. ₃Todos somos portadores de pedaços desse tesouro. ₄Você pode guardar, compartilhar ou vender. ₅Você pode não saber, receber ou comprar. ₆Muitos gastarão a vida tentando juntar os pedaços, acreditando que o mapa mostrará o local do rico tesouro. ₇Você juntará em vão, até perceber que o mapa é o próprio tesouro."}, {"n": 137, "text": "Como você usaria as redes sociais se só pudesse acessá-las durante um minuto por dia? ₂E se só pudesse ouvir uma música por semana? ₃E se só trabalhasse uma vez por mês? ₄E se pudesse ver as pessoas que ama somente uma vez por ano? ₅E se viver fosse só uma vez? ₆E se faltasse um minuto para o fim do mundo? ₇A quantidade mudaria suas respostas e ações?"}, {"n": 138, "text": "Não quando você quer, mas sim no tempo determinado. ₂O tempo de espera é um tempo de preparo. ₃Muitas vezes em silêncio, “sozinho” e sem previsões. ₄É necessário passarmos pela dor do crescimento para, assim, valorizarmos ao máximo a bênção recebida. ₅Não seja imediatista; aguarde com sabedoria, pedindo sempre discernimento e direcionamento. ₆Esperar com sabedoria é uma grande virtude. ₇Todas as respostas estão no caminho."}, {"n": 139, "text": "Sempre que você guardar um sentimento, ele o consumirá aos poucos, tal qual o fogo consome a aroeira e a quaresmeira. ₂Encerrar ciclos é como cortar uma árvore de dez anos de idade. ₃A dor é anterior ao alívio, e a guerra é anterior à paz. ₄Feliz é aquele que passa pela guerra sem deixar que ela faça parte do seu ser. ₅Quem encontra um amigo, encontra uma fonte no deserto. ₆Beba da fonte, encha sua vasilha e continue o seu caminho. ₇Saudade é quando a vida continua."}, {"n": 140, "text": "O tolo sempre se sente preparado e pronto para entrar em qualquer batalha. ₂O sábio, por sua vez, antes se pergunta: “Eu realmente quero, preciso e necessito vencer esta batalha?” ₃Mais importante do que escolher suas batalhas é ter clareza de quais delas você não precisa vencer. ₄Não gaste sua energia com batalhas que não foram feitas para você. ₅Uma mansão inacabada, um livro por ler, um filme pela metade. ₆Se você não consegue vislumbrar um fim, esse é um sinal para que não exista um início. ₇Talvez essa seja a beleza da vida — um jogo incompleto, histórias por ler e escrever, um eterno quebra-cabeça sendo montado, sem a lembrança clara da imagem original."}, {"n": 141, "text": "Você tem medo do escuro? ₂Você já teve medo do escuro? ₃Quando todas as luzes se apagarem, se você fechar os olhos, poderá enxergar claramente tudo o que está dentro. ₄Tudo o que está fora também está dentro, porque tudo o que está fora é um reflexo das sombras e luzes que te revelam. ₅Sou grato pela escuridão que me cerca, sou grato pelos demônios que me rodeiam – são eles que potencializam a luz que habita meu ser. ₆Gratidão é diferente de dependência. ₇A sombra é necessária para que não nos esqueçamos da luz."}, {"n": 142, "text": "As emoções e pensamentos devem fluir como as águas tranquilas de um rio. ₂As emoções e ações devem ter a intensidade e a força da queda de uma cachoeira. ₃Esse rio me é tão familiar, eu já o vi transbordar, já o vi carregar troncos que cem homens juntos não conseguiriam. ₄Já vi suas águas diminuírem, a ponto de uma criança poder atravessá-lo sem medo algum. ₅Já o vi de tantas formas diferentes, e ele continua lá. ₆A energia do rio está na constância do seu movimento. ₇Quando você se encontrar com o caminho, simplesmente flua: tudo acontecerá de uma forma assustadoramente normal. ₈Mas, acima de tudo, lembre-se de que, se for preciso cortar caminhos, abrir passagens, construir pontes e moldar o destino – faça sem medo! ₈O universo é calmaria e silêncio, mas a sua dualidade é o movimento e o caos."}, {"n": 143, "text": "Uma vida de total gozo é uma vida amargurada! Por que essa afirmação faz tanto sentido neste momento? ₂Que eu suba aos mais altos montes, que eu desça aos mais profundos vales, para me encontrar; pois, ao me encontrar, eu te encontro. ₃Quando você evoca(r) a centelha divina que habita seu ser, o universo todo se rende(rá) ao seu poder. ₄Os rituais são importantes: ao passo que somos corpo em espírito, somos corpo em verdade, somos uma família. ₅Domine todos os seus sentidos; domine a natureza, os minerais e os animais. ₆A mais poderosa potência de energia só será encontrada quando você buscar, encontrar e usar os intermediários que estão fora. ₇Enquanto você não encarar e dominar a besta que está fora, não terá acesso nem poder sobre a besta que está dentro. ₈De igual modo, enquanto você não libertar o celestial que faz morada em seu ser, ele não será evocado para fora. ₉E tenho dito — nós nos separamos e sofremos."}, {"n": 144, "text": "Manter uma chama acesa exigirá muito trabalho; sou grato que assim seja. ₂Deixo registrado esse sábio conselho que recebi: “Em vez de se concentrar em manter todas as chamas acesas, peça sabedoria, discernimento e orientação para entender quais devem ser apagadas e quais devem ser mantidas.” ₃Não se culpe por manter a chama apenas acesa; lembre-se de que suas labaredas não precisam tocar o céu a todo instante. ₄O que você fará quando começar a chover? ₅Em estado de sobrevivência, algumas coisas são extremamente importantes: abrigo, água potável, fogo e alimento. ₆Se você apenas pensar em sobrevivência, a besta que habita seu ser rugirá; ₇quando você começar a prosperar, o celestial que habita seu ser despertará. ₈Não negue sua essência. ₉Domine-a! Todas as respostas estão no equilíbrio."}, {"n": 145, "text": "O universo não é o seu inimigo. ₂Só depois de eliminar os ruídos e ecos é que você poderá ver claramente o que já é. ₃A abundância plena é natural em todas as áreas da vida. ₄Você precisa acessar e romper os bloqueios ancestralizados. ₅A mudança não acontecerá do dia para a noite, mas seu espírito sentirá quando acontecer. ₆Eis que, no início, tudo era perfeito e bom. ₇O universo é seu amigo!"}, {"n": 146, "text": "Contemple o nascer e o pôr do sol. ₂Veja, ouça e sinta a natureza e os animais. ₃Observe as aves do campo. ₄Pare de ver o que não se pode tocar. ₅Respire fundo sete vezes. ₆Aceite o presente. ₇Ame muito!"}, {"n": 147, "text": "Por que você está preso pela sua falta de propósito? ₂Não saber qual é o próximo passo gera uma angústia incrivelmente dolorosa. ₃Não saber o porquê de os passos estarem sendo dados é como ter o próprio coração nas mãos e apertá-lo com toda a força – é sufocante, agoniante, beirando o insuportável. ₄Você tem as chaves e não se liberta – eu sei que isso te confronta todas as vezes que o silêncio se faz presente. ₅É necessário despir-se de tudo o que você não é. ₆Eles querem te vender, eles querem te comprar – ou será que, na verdade, é você que deseja comprar e vender? ₇Você pode comer de todas as frutas do jardim."}, {"n": 148, "text": "O iluminado que não come o alimento da própria horta é pior que o mundano que ele alega não ser. ₂Aquele que julga fecha os olhos e alega ver o que ninguém vê. ₃Encontrei ironia ao encontrar uma folha com o seguinte escrito: “Preserve as árvores, pare de suar papel.” ₄Quem segue em retiro para a floresta, buscando a iluminação, encontrará a solidão que o primeiro homem encontrou. ₅E, no início, havia a solidão, e era só o que existia. ₆Eis que tudo foi criado e, mesmo assim, o homem se sentia só. ₇Quando se encontrar consigo mesmo, entenderá que a solidão faz parte de seu ser."}, {"n": 149, "text": "Todo pensamento que não se transformou em ação gerou um trauma mental. ₂Toda mentalização que não se converteu e se materializou se transformou em um trauma físico. ₃Os traumas físicos e mentais são os pais de todos os traumas espirituais. ₄Quando você encontrar o equilíbrio, viver se tornará um espetáculo imensurável. ₅Não existe uma guerra interior contra você mesmo; o que existe é o desejo interno, externo e eterno(al) pela paz. ₆A verbalização tem o poder de curar o corpo, a mente e o espírito. ₇Apenas uma palavra te separa do equilíbrio: a desunião."}, {"n": 150, "text": "Ao ser humilhado, leve sua raiva para passear; subam juntos, caminhando até o topo de uma montanha e, ao chegarem lá, medite por quinze minutos. ₂Ao ser exaltado, leve sua arrogância para passear; subam juntos, correndo, até o topo de uma montanha e, ao chegarem lá, medite por sessenta minutos, mais dez. ₃Raiva e arrogância são amigas da vã mente. ₄Já que você nunca subirá a montanha sozinho, trate de não subir acompanhado demais. ₅Troque o termo “caminhar em círculos” por “subir a montanha”. ₆Leia enquanto caminha, caminhe enquanto medita e medite enquanto lê. ₇Diga não!"}, {"n": 151, "text": "O prêmio para aqueles que não se corrompem é a paz de espírito de se despirem de uma roupa sem manchas. ₂Os bons lutam para chegar ao pódio. ₃Os grandes lutam para chegar em primeiro ao pódio. ₄Os gigantes lutam para se manterem em primeiro no pódio. ₅Os fora de série lutam para serem os melhores em todas as áreas da vida. ₆Os normais, como sempre, só aplaudem. ₇Os humildes seguem em silêncio."}, {"n": 152, "text": "Quem pensa em mudar o mundo sem primeiro mudar a si mesmo, está construindo uma ponte sobre a grama. ₂Se as repetições, pessoas e pensamentos te incomodam, mude-os. ₃Depois de sete dias em silêncio, você aprenderá o real valor de cada letra, de cada palavra, de cada frase. ₄Quem julga somente os seus movimentos, não está digno de descansar ao seu lado. ₅O aplauso é a principal forma de envergonhar um homem. ₆Você já viu animais batendo palmas para celebrar as palavras de outro animal? ₇Os humanos produzem muito lixo com palavras."}, {"n": 153, "text": "Se você não quer ver determinada coisa, deixe de ver. ₂A tendência natural do homem é de complicar o sim e o não. ₃O meio-termo é um convite para o não; em paralelo, a tentação é um convite para a glória. ₄A virtude caminha lado a lado com o coração nômade. ₅Diga-me: ONDE POSSO ENCONTRAR VIRTUDE NA SUA VIDA? ₆Mostre-me os seus frutos! ₇Deixe de seguir os homens; continue seguindo apenas o caminho, a verdade e a vida."}, {"n": 154, "text": "A vida é estruturada por leis e por ordem. ₂Você precisa entender que, quando se entra no flow de qualquer atividade, o desempenho se torna natural e prazeroso. ₃Quando sentir que o universo está contra você, significa que você está contra ele. ₄Como fazer as pazes com o universo? ₅Mude sua postura física, seu foco mental e sua vibração espiritual. ₆Enquanto o universo estiver exportando o seu projeto, não se aquiete — apenas aproveite, com sabedoria, o tempo de espera. ₇Ficar olhando para a porcentagem que ainda falta é de uma tolice gigante. ₇Quem olha por mais de um segundo e meio para o relógio, se sente pressionado, ansioso e engolido pelo tempo."}, {"n": 155, "text": "Mesmo as feridas físicas mais graves deixam apenas marcas, após se cicatrizarem. ₂As feridas da alma, quando não tratadas, podem permanecer expostas por toda uma vida. ₃Nossas ações dão permissão. ₄Nossas palavras abrem e fecham portas. ₅Nossos pensamentos plantam vida e morte. ₆Algumas feridas emocionais só podem ser saradas com perdão, e todas podem ser saradas com amor. ₇Limpe as suas feridas!"}, {"n": 156, "text": "Quem rouba uma uva pode roubar um milhão de reais. ₂Se existisse uma balança, o que valeria mais: tempo ou ouro? ₃O grande deus da nossa geração é o entretenimento, que traz consigo suas camadas: o prazer instantâneo, a ansiedade e a comparação. ₄Nunca estamos satisfeitos; não basta mexer na carniça, queremos deitar e rolar. ₅Todo esse envolvimento com a podridão faz com que estejamos mortos em vida — exalando, assim, o perfume da mo
